name: daily-reports

# 每个交易日自动出两份报告，**完整内容直接写进邮件正文**（无附件）
#
#   12:05（CST）  午间报告 —— 半日行情 + 预案核对 + 午后判断
#   16:50（CST）  晚间报告 —— 全天汇总 + 调仓 + 次日计划 + 复盘
#
# GitHub cron 用 UTC，北京 = UTC+8：
#   12:05 CST = 04:05 UTC
#   16:50 CST = 08:50 UTC（比 market-db 的 16:30 晚 20 分钟，等它先跑完当日增量）
#
# 产物分工（用户要求）：
#   - 网页版 HTML：**只在门户手动点按钮时生成**，CI 传 `--no-html` 不写文件
#   - 邮件正文 HTML：完整报告（11 节 / 7 节）全部塞进正文，邮件安全渲染，无附件
#
# 发信方式：**完全交给 `dawidd6/action-send-mail`**。
# 仓库里没有任何 SMTP 代码，也不保存邮箱密码 —— 全部走 Repository / Environment secrets。

on:
  schedule:
    - cron: "5 4 * * 1-5"     # 12:05 CST 午报
    - cron: "50 8 * * 1-5"    # 16:50 CST 晚间
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=按时间 / midday=强制午报 / evening=强制晚间"
        type: choice
        options: [auto, midday, evening]
        default: auto

concurrency:
  group: daily-reports
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ★ 必须设北京时区：session_guard 用本地墙钟判断是否午休，
  #   runner 默认 UTC，不设这个午报永远不在窗口内。
  TZ: Asia/Shanghai
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  PORTAL_MARKET_DB: ${{ github.workspace }}/portal/data/market.db

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ★ 必须声明 environment，否则读不到 environment 级 secrets。
    #   实测（2026-10-20 首次真实运行）：用户把 `EMAIL_SENDER` 建成了**环境名**，
    #   三个 secret 放在该环境里；job 不声明 environment 时 secrets.X 全为空，
    #   表现为「报告生成成功、发信被静默跳过」。
    environment: EMAIL_SENDER
    steps:
      # 检出到 portal/ 子目录：代码里用 `from portal.xxx import`，
      # 要求「仓库根 = portal 的父目录」。
      - uses: actions/checkout@v4
        with:
          path: portal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: portal/requirements-marketdb.txt

      # 只 restore、不 save：数据库由 market-db.yml 负责写入与缓存维护。
      # 若这里也用 actions/cache@v4，每次未命中都会另存一份 1.9 GB，
      # 几次就把仓库 10 GB 的缓存配额吃光。
      - name: Restore market.db (read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            portal/data/market.db
            portal/data/market.db-wal
            portal/data/market.db-shm
          key: marketdb-${{ github.run_id }}
          restore-keys: |
            marketdb-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r portal/requirements-marketdb.txt
          pip install "litellm>=1.40"

      - name: Resolve mode
        id: mode
        run: |
          set -e
          IN="${{ github.event.inputs.mode || 'auto' }}"
          CRON="${{ github.event.schedule }}"
          MODE="$IN"
          if [ "$IN" = "auto" ]; then
            if [ "$CRON" = "5 4 * * 1-5" ]; then MODE=midday; else MODE=evening; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "决定：$MODE（cron=$CRON）"

      # 晚间需要「今天」的日K。缓存里的库可能还停在昨天，就地补一次增量
      # （UPDATE 幂等，重复跑无副作用）。节假日写不进任何行，下一步会跳过。
      - name: Ensure today's bars (evening only)
        if: steps.mode.outputs.mode == 'evening'
        continue-on-error: true
        run: |
          if [ ! -f "$PORTAL_MARKET_DB" ]; then
            python -m portal.virtual.marketdb init
          fi
          python -m portal.virtual.marketdb update-today || true

      # 用「库里最新交易日 == 今天」判断今天是否真的开市。
      # 节假日两者不等 → 整份跳过（不发信、不算失败）。
      - name: Trading day check
        id: td
        run: |
          set -e
          TODAY=$(date +%Y%m%d)
          LATEST=$(python -c "from portal.virtual import marketdb as M; c = M.connect(); print((M.latest_trade_date(c) or '').replace('-', '') if c else '')" 2>/dev/null || echo "")
          echo "today=$TODAY latest=$LATEST"
          if [ "${{ steps.mode.outputs.mode }}" = "midday" ]; then
            # 午报自己有时段护栏（会核对官方快照是不是今天 11:30），这里放行
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$LATEST" ] && [ "$LATEST" = "$TODAY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::库里最新交易日 [$LATEST] ≠ 今天 [$TODAY]，今天非交易日，跳过"
          fi

      # ★ --no-html：不写网页版（用户要求 HTML 只在门户手动生成）
      # ★ --mail   ：完整报告写成邮件安全的 HTML，作为邮件正文
      - name: Run midday report
        if: steps.td.outputs.run == 'true' && steps.mode.outputs.mode == 'midday'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          rm -f "${{ github.workspace }}/mail_body.html"
          python -m portal.premarket midday --no-html \
            --mail "${{ github.workspace }}/mail_body.html" --json \
            | tee /tmp/report.json

      - name: Run evening report
        if: steps.td.outputs.run == 'true' && steps.mode.outputs.mode == 'evening'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          rm -f "${{ github.workspace }}/mail_body.html"
          python -m portal.premarket daily --no-html \
            --mail "${{ github.workspace }}/mail_body.html" --json \
            | tee /tmp/report.json

      # 正文就是报告本身，所以只要文件在就发。主题从报告 JSON 里取。
      - name: Prepare mail
        id: mail
        if: steps.td.outputs.run == 'true'
        run: |
          set +e
          BODY="${{ github.workspace }}/mail_body.html"
          if [ ! -s "$BODY" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "::notice::本次没有生成邮件正文（任务被跳过或失败），不发信"
            exit 0
          fi
          SUBJECT=$(python -c "
          import json, sys
          try:
              d = json.load(open('/tmp/report.json', encoding='utf-8'))
          except Exception:
              print(''); sys.exit(0)
          print(d.get('mail_subject') or '')
          ")
          if [ -z "$SUBJECT" ]; then SUBJECT="A股盘前报告"; fi
          echo "send=true" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "正文 $(wc -c < "$BODY") 字节，主题：$SUBJECT"

      - name: Check mail secrets
        id: secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.EMAIL_SENDER }}" ]    && MISSING="$MISSING EMAIL_SENDER"
          [ -z "${{ secrets.EMAIL_PASSWORD }}" ]  && MISSING="$MISSING EMAIL_PASSWORD"
          [ -z "${{ secrets.EMAIL_RECEIVERS }}" ] && MISSING="$MISSING EMAIL_RECEIVERS"
          if [ -n "$MISSING" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::缺少邮件 secrets：$MISSING"
            echo "::error::要么放进仓库级 Secrets（Settings → Secrets and variables → Actions → Secrets），要么放进名为 EMAIL_SENDER 的 Environment。环境名不是 secret 名。"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # ★ 唯一的发信环节。正文 = 完整报告，**不带附件**。
      # 需要的 secrets：
      #   EMAIL_SENDER / EMAIL_PASSWORD（授权码）/ EMAIL_RECEIVERS
      #   EMAIL_SMTP_HOST（可选，默认 smtp.qq.com）/ EMAIL_SMTP_PORT（可选，默认 465）
      - name: Send mail
        id: send
        if: |
          steps.td.outputs.run == 'true' &&
          steps.mail.outputs.send == 'true' &&
          steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SMTP_HOST || 'smtp.qq.com' }}
          server_port: ${{ secrets.EMAIL_SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.mail.outputs.subject }}
          to: ${{ secrets.EMAIL_RECEIVERS }}
          from: ${{ secrets.EMAIL_SENDER }}
          html_body: file://${{ github.workspace }}/mail_body.html
          priority: normal

      # 网页版 HTML 在 CI 里不再生成，所以只归档数据和邮件正文。
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            portal/data/premarket/plans/*.json
            portal/data/premarket/reports/*_midday.json
            mail_body.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ steps.mode.outputs.mode }} 报告"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 交易日检查 | run=${{ steps.td.outputs.run }} |"
            echo "| 发信 | send=${{ steps.mail.outputs.send }} / outcome=${{ steps.send.outcome }} |"
            echo "| 主题 | ${{ steps.mail.outputs.subject }} |"
            echo "| 午报任务 | ${{ steps.midday.outcome }} |"
            echo "| 晚间任务 | ${{ steps.evening.outcome }} |"
            echo ""
            echo "> 邮件正文 = 完整报告（无附件）；网页版 HTML 只在门户手动生成。"
            echo "> 节假日自动跳过（库里最新交易日 ≠ 今天）。"
            echo "> 午报只在 11:25–13:15 且官方快照为今天 11:30 时生成。"
          } >> "$GITHUB_STEP_SUMMARY"
