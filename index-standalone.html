<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票分析 · Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --brand:    #2563eb;
      --brand-lt: #eff6ff;
      --green:    #16a34a;
      --red:      #dc2626;
      --amber:    #d97706;
      --gray-50:  #f9fafb;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* Tab panel visibility */
    .tab-panel          { display: none; }
    .tab-panel.active   { display: block; }

    /* Nav tab button states */
    .nav-tab            { transition: all .15s; }
    .nav-tab.active     { background: rgba(255,255,255,.95); box-shadow: 0 1px 3px rgba(0,0,0,.15); color: #1e40af; }
    .nav-tab:not(.active):hover { background: rgba(255,255,255,.15); }

    /* Form controls */
    .form-input, .form-select {
      width: 100%; padding: .5rem .75rem;
      border: 1.5px solid #e5e7eb; border-radius: .5rem;
      font-size: .875rem; background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus, .form-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    /* Signal badges */
    .badge-buy   { background:#dcfce7; color:#15803d; }
    .badge-watch { background:#dbeafe; color:#1d4ed8; }
    .badge-hold  { background:#f3f4f6; color:#4b5563; }
    .badge-sell  { background:#fee2e2; color:#b91c1c; }

    /* Score ring animation */
    @keyframes ring-in { from { stroke-dashoffset: 251; } }
    .score-ring { animation: ring-in .6s ease-out forwards; }

    /* Log terminal */
    #log-box {
      font-family: 'Menlo','Monaco','Consolas',monospace;
      font-size: .7rem; line-height: 1.6;
    }

    /* Report section accordion */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary .chevron { transform: rotate(90deg); }
    .chevron { transition: transform .2s; display: inline-block; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9px; }

    /* Chip */
    .chip { cursor: pointer; transition: all .12s; user-select: none; }
    .chip:hover { border-color: #3b82f6; color: #1d4ed8; background: #eff6ff; }
    .chip.selected { border-color: #3b82f6; color: #1d4ed8; background: #eff6ff; font-weight: 600; }

    /* Server status dot */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.online  { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
    .status-dot.offline { background: #d1d5db; }
    .status-dot.checking{ background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* Skeleton loader */
    .skeleton { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
                background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius:.375rem; }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    /* Toast */
    #toast { transition: opacity .25s, transform .25s; }
    #toast.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }

    /* === UI 增强 === */
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #fafbff 50%, #f0fdf4 100%);
      min-height: 100vh;
    }
    /* Log terminal - also covers res-log-box */
    #res-log-box {
      font-family: 'Menlo','Monaco','Consolas',monospace;
      font-size: .7rem; line-height: 1.6;
    }
    /* Button press feedback */
    button:not(:disabled):active { transform: scale(0.97); }
    /* Card hover elevation */
    .bg-white.border.border-gray-100.rounded-2xl { transition: box-shadow .2s; }
    .bg-white.border.border-gray-100.rounded-2xl:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
    /* Header glass effect */
    header { background: rgba(255,255,255,0.92) !important; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    /* Main content spacing */
    main { padding-top: 1.5rem; padding-bottom: 2rem; }
    /* Responsive adjustments */
    @media (max-width: 640px) {
      nav#tab-nav { max-width: 100%; }
      header .max-w-4xl { padding-left: .75rem; padding-right: .75rem; }
      main .max-w-4xl { padding-left: .75rem; padding-right: .75rem; }
      footer .max-w-4xl { padding-left: .75rem; padding-right: .75rem; }
    }

    /* ── 响应式页面最大宽度 ── */
    .page-wrap { max-width: 900px; margin: 0 auto; }

    /* ── Header gradient ── */
    .header-gradient {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #2563eb 100%);
    }

    /* ── 卡片悬停提升 ── */
    .card-hover {
      transition: box-shadow .2s, transform .15s;
    }
    .card-hover:hover {
      box-shadow: 0 4px 20px rgba(37,99,235,.10);
      transform: translateY(-1px);
    }

    /* ── 快捷维度按钮 ── */
    .dim-quick-btn {
      cursor: pointer; user-select: none;
      padding: .25rem .75rem; border-radius: .5rem;
      font-size: .7rem; font-weight: 600;
      border: 1.5px solid transparent;
      transition: all .12s;
    }
    .dim-quick-btn:hover { filter: brightness(.94); }
    .dim-quick-btn.dq-all       { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
    .dim-quick-btn.dq-tech      { background:#dbeafe; color:#1e40af; border-color:#93c5fd; }
    .dim-quick-btn.dq-fund      { background:#d1fae5; color:#065f46; border-color:#6ee7b7; }
    .dim-quick-btn.dq-ind       { background:#ede9fe; color:#4c1d95; border-color:#c4b5fd; }
    .dim-quick-btn.dq-fund-ind  { background:#fef3c7; color:#92400e; border-color:#fcd34d; }

    /* ── 分析维度行 ── */
    .dim-group-label {
      font-size: .65rem; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: #9ca3af;
      padding: .5rem 1rem .25rem;
    }

    /* ── 分析卡片 badge ── */
    .dim-badge {
      display: inline-flex; align-items: center;
      padding: .1rem .5rem; border-radius: 9999px;
      font-size: .65rem; font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- ══════════════ HEADER ══════════════ -->
<header class="sticky top-0 z-40 shadow-lg" style="background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 60%,#2563eb 100%) !important; background-color:transparent !important"  >
  <div class="page-wrap px-4 h-14 flex items-center gap-4">

    <!-- Brand -->
    <div class="flex items-center gap-2.5 flex-shrink-0">
      <div class="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
        <span class="text-base">📈</span>
      </div>
      <div>
        <span class="font-bold text-white text-sm tracking-tight">股票分析 Portal</span>
        <span class="hidden sm:inline text-blue-200 text-xs ml-2">AI 量化分析</span>
      </div>
    </div>

    <!-- Nav tabs -->
    <nav class="flex-1 flex bg-white/15 rounded-xl p-1 gap-0.5 overflow-x-auto" id="tab-nav" role="tablist">
      <!-- filled by JS -->
    </nav>

    <!-- Server status -->
    <div class="ml-auto flex items-center gap-2 flex-shrink-0">
      <span class="status-dot checking" id="status-dot"></span>
      <span class="text-xs text-blue-100" id="status-label">检测中</span>
    </div>
  </div>
</header>

<!-- ══════════════ MAIN ══════════════ -->
<main class="page-wrap px-4 py-5">
  <div id="tab-content"><!-- panels injected by JS --></div>
</main>

<!-- ══════════════ STICKY FOOTER ══════════════ -->
<footer class="bg-white border-t border-gray-200 sticky bottom-0 z-30 shadow-sm">
  <div class="page-wrap px-4 h-12 flex items-center justify-between">
    <p id="footer-time" class="text-xs text-gray-400"></p>
    <button id="btn-save"
      class="flex items-center gap-1.5 px-4 py-1.5 bg-blue-600 hover:bg-blue-700

      <span>💾</span><span>保存配置</span>

</footer>

<!-- ══════════════ MODAL ══════════════ -->
<div id="modal" class="fixed inset-0 z-50 hidden">
  <div id="modal-bg" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b">
        <h2 class="font-semibold text-gray-800">保存配置</h2>
        <button id="modal-close" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">×</button>
      </div>
      <div class="px-5 py-4 space-y-4">

        <!-- Direct save (needs server) -->
        <div id="modal-direct" class="rounded-xl border-2 border-green-200 bg-green-50 p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="text-sm font-semibold text-green-800">🚀 直接保存到文件</p>
              <p class="text-xs text-green-700 mt-0.5">自动写入 <code class="bg-green-100 px-1 rounded">config/watchlist.json</code></p>
            </div>
            <button id="modal-btn-save" disabled
              class="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors

              保存
            </button>
          </div>
          <div id="modal-save-msg" class="mt-2 text-xs hidden"></div>
          <p id="modal-server-hint" class="mt-2 text-xs text-green-700">
            需要先运行：<code class="bg-green-100 px-1 rounded">python portal/server.py</code>
          </p>

        <!-- Copy -->
        <div class="rounded-xl border border-gray-200 p-4">

            <textarea id="modal-json" readonly rows="7"

            <button id="modal-copy"
              class="absolute top-2 right-2 px-2.5 py-1 bg-blue-600 hover:bg-blue-700
                     text-white text-xs rounded-md transition-colors">复制</button>
          </div>
          <p class="mt-2 text-xs text-gray-400">复制后粘贴保存为仓库中的 config/watchlist.json 并提交</p>
        </div>

      </div>
      <div class="px-5 py-3 border-t flex justify-end">
        <button id="modal-close2" class="px-4 py-1.5 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg">关闭</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ TOAST ══════════════ -->
<div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 hidden
                       px-4 py-2 rounded-xl text-white text-xs font-medium shadow-lg">
</div>

<!-- ══════════════ JS ══════════════ -->
<script>

// ── js/config.js ──────────────────────────────
/**
 * config.js — 前端共享配置常量
 *
 * 统一本地增强服务地址，供各 Tab / 组件 import。
 * 原先每个文件各自声明服务地址（6 处重复），且需 build_standalone.py
 * 的 COLLIDING 机制在内联时逐个改名防冲突；集中到此处后：
 *   - HTTP 模式：各文件 import { SERVER } 正常工作
 *   - standalone 模式：build 脚本删除 import，仅本文件保留唯一声明
 *     （本文件在 ORDER_WITH_PREFIX 中排最前，无需 COLLIDING 改名）
 */
const SERVER = 'http://127.0.0.1:7788';

// ── js/components/toast.js ──────────────────────────────
/**
 * components/toast.js — 轻量通知条
 */
class Toast {
  constructor() { this._el = null; this._timer = null; }
  _el_() {
    if (!this._el) this._el = document.getElementById('toast');
    return this._el;
  }
  show(msg, type = 'info', ms = 2400) {
    const el = this._el_();
    if (!el) return;
    const colors = { success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-amber-500', info: 'bg-gray-800' };
    el.removeAttribute('class');
    el.className = `fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-white text-xs font-medium shadow-lg whitespace-nowrap ${colors[type] || colors.info}`;
    el.textContent = msg;
    el.style.display = '';
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => { el.style.display = 'none'; }, ms);
  }
}
const toast = new Toast();

// ── js/components/modal.js ──────────────────────────────
/**
 * components/modal.js — 保存配置弹窗
 */


class Modal {
  constructor() {
    this._el     = null;
    this._store  = null;
    this._toast  = null;
    this._online = false;
  }

  init(store, serverUrl, toast) {
    this._store = store;
    this._toast = toast;
    this._el = document.getElementById('modal');

    document.getElementById('modal-bg')?.addEventListener('click', () => this.hide());
    document.getElementById('modal-close')?.addEventListener('click', () => this.hide());
    document.getElementById('modal-close2')?.addEventListener('click', () => this.hide());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') this.hide(); });

    // 复制按钮
    document.getElementById('modal-copy')?.addEventListener('click', async () => {
      const ta = document.getElementById('modal-json');
      try {
        await navigator.clipboard.writeText(ta.value);
        this._toast.show('已复制到剪贴板', 'success');
      } catch { ta.select(); }
    });

    // 直接保存按钮
    document.getElementById('modal-btn-save')?.addEventListener('click', () => this._directSave());
  }

  setServerOnline(online) {
    this._online = online;
    this._refreshSaveBtn();
  }

  show(json) {
    document.getElementById('modal-json').value = json;
    document.getElementById('modal-save-msg')?.classList.add('hidden');
    this._refreshSaveBtn();
    this._el?.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  hide() {
    this._el?.classList.add('hidden');
    document.body.style.overflow = '';
  }

  _refreshSaveBtn() {
    const btn  = document.getElementById('modal-btn-save');
    const hint = document.getElementById('modal-server-hint');
    if (!btn) return;
    if (this._online) {
      btn.disabled = false;
      btn.className = 'flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors bg-green-600 hover:bg-green-700 text-white cursor-pointer';
      btn.textContent = '💾 保存';
      if (hint) hint.classList.add('hidden');
    } else {
      btn.disabled = true;
      btn.className = 'flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-200 text-gray-400 cursor-not-allowed';
      btn.textContent = '保存（需服务）';
      if (hint) hint.classList.remove('hidden');
    }
  }

  async _directSave() {
    const json = document.getElementById('modal-json').value;
    const btn  = document.getElementById('modal-btn-save');
    const msg  = document.getElementById('modal-save-msg');
    btn.disabled = true;
    btn.textContent = '⏳ 保存中...';
    try {
      const res  = await fetch(`${SERVER}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: json,
        signal: AbortSignal.timeout(5000),
      });
      const data = await res.json();
      if (data.ok) {
        msg.className = 'mt-2 text-xs text-green-700 bg-green-100 rounded-lg px-2 py-1';
        msg.textContent = '✅ 已保存到 config/watchlist.json';
        msg.classList.remove('hidden');
        btn.textContent = '✅ 已保存';
        setTimeout(() => { btn.textContent = '💾 保存'; btn.disabled = false; }, 2000);
      } else throw new Error(data.error);
    } catch (e) {
      msg.className = 'mt-2 text-xs text-red-600 bg-red-50 rounded-lg px-2 py-1';
      msg.textContent = `❌ 保存失败：${e.message}`;
      msg.classList.remove('hidden');
      btn.textContent = '💾 保存';
      btn.disabled = false;
    }
  }
}

const modal = new Modal();

// ── js/components/report-view.js ──────────────────────────────
/**
 * components/report-view.js — 结构化报告渲染组件
 *
 * 布局规则：
 *   - 只有技术面：单列全宽
 *   - 技术面 + 1个其他维度：左右各半
 *   - 技术面 + 2个其他维度：技术面左半，右半再分两行
 *   - 无技术面：各维度按顺序竖排
 * 顺序：技术面 → 基本面 → 产业链
 * 底部：tech_summary AI 一句话 + 综合结论
 */

const SIGNAL_CONFIG = {
  buy:   { label: '买入',  bg: 'bg-green-100',  text: 'text-green-700',  border: 'border-green-300',  dot: '#16a34a' },
  watch: { label: '关注',  bg: 'bg-blue-100',   text: 'text-blue-700',   border: 'border-blue-300',   dot: '#2563eb' },
  hold:  { label: '持有',  bg: 'bg-gray-100',   text: 'text-gray-600',   border: 'border-gray-300',   dot: '#6b7280' },
  sell:  { label: '卖出',  bg: 'bg-red-100',    text: 'text-red-700',    border: 'border-red-300',    dot: '#dc2626' },
};

const DIM_ICONS = {
  technical:   '📊',
  fundamental: '📈',
  industry:    '🏭',
};

const DIM_ORDER = ['technical', 'fundamental', 'industry'];

class ReportView {
  constructor(container) {
    this._container = container;
  }

  render(report) {
    const { stock_code, stock_name, overall_score, overall_signal,
            overall_signal_label, conclusion, tech_summary, dimensions, generated_at } = report;

    const sig = SIGNAL_CONFIG[overall_signal] || SIGNAL_CONFIG.hold;

    // 按固定顺序排列维度
    const sortedDims = [...(dimensions || [])].sort((a, b) => {
      const oa = DIM_ORDER.indexOf(a.dimension);
      const ob = DIM_ORDER.indexOf(b.dimension);
      return (oa < 0 ? 99 : oa) - (ob < 0 ? 99 : ob);
    });

    this._container.innerHTML = `
      <!-- 报告头部 -->
      <div class="mb-5 p-4 rounded-xl bg-gradient-to-r from-gray-50 to-blue-50 border border-gray-200">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <span class="font-bold text-xl text-gray-900">${this._esc(stock_name)}</span>
            <span class="ml-2 font-mono text-sm text-gray-500">${this._esc(stock_code)}</span>
            <div class="mt-1 text-xs text-gray-400">${this._fmtTime(generated_at)}</div>
          </div>
          <div id="radar-chart" style="width:220px;height:160px;flex-shrink:0"></div>
        </div>
      </div>

      <!-- 维度卡片区域（自适应布局） -->
      <div id="report-columns" class="mb-5"></div>

      <!-- 技术面 AI 一句话 -->
      ${tech_summary ? `
        <div class="mb-3 px-4 py-2.5 rounded-xl bg-gray-800 text-gray-100 text-sm font-medium flex items-center gap-2">
          <span>${this._esc(tech_summary)}</span>
        </div>
      ` : ''}

      <!-- 综合结论 -->
      <div class="p-4 rounded-xl border-2 ${sig.border} ${sig.bg}">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-base font-bold ${sig.text}">🎯 综合结论</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-white/70 ${sig.text} font-medium border ${sig.border}">
            ${overall_signal_label || sig.label}
          </span>
          <span class="text-xs text-gray-500 ml-auto">综合评分 ${overall_score}/100</span>
        </div>
        <p class="text-sm text-gray-700 leading-relaxed">${this._esc(conclusion)}</p>
      </div>
    `;

    // 渲染自适应列布局
    this._renderColumns(sortedDims, report);

    setTimeout(() => {
      this._initRadar(report);
      this._initKlineChart(report);
    }, 0);
  }

  _renderColumns(sortedDims, report) {
    const colContainer = this._container.querySelector('#report-columns');
    const techDims  = sortedDims.filter(d => d.dimension === 'technical');
    const otherDims = sortedDims.filter(d => d.dimension !== 'technical');

    if (techDims.length === 0) {
      // 无技术面：全部竖排
      const col = document.createElement('div');
      col.className = 'space-y-4';
      otherDims.forEach(d => col.appendChild(this._renderDimension(d, report)));
      colContainer.appendChild(col);
      return;
    }

    if (otherDims.length === 0) {
      // 只有技术面：单列全宽
      const col = document.createElement('div');
      col.className = 'space-y-4';
      techDims.forEach(d => col.appendChild(this._renderDimension(d, report)));
      colContainer.appendChild(col);
      return;
    }

    // 技术面 + 其他：左右布局
    const wrapper = document.createElement('div');
    wrapper.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

    // 左列：技术面
    const leftCol = document.createElement('div');
    leftCol.className = 'space-y-4';
    techDims.forEach(d => leftCol.appendChild(this._renderDimension(d, report)));
    wrapper.appendChild(leftCol);

    // 右列：基本面 + 产业链（竖排）
    const rightCol = document.createElement('div');
    rightCol.className = 'space-y-4';
    otherDims.forEach(d => rightCol.appendChild(this._renderDimension(d, report)));
    wrapper.appendChild(rightCol);

    colContainer.appendChild(wrapper);
  }

  _renderDimension(dim, report) {
    const sig  = SIGNAL_CONFIG[dim.signal] || SIGNAL_CONFIG.hold;
    const icon = DIM_ICONS[dim.dimension] || '📋';

    const el = document.createElement('div');
    el.className = 'bg-white border border-gray-200 rounded-xl overflow-hidden';

    const klineHtml = (dim.dimension === 'technical' && report && report.kline_data)
      ? `<div id="kline-chart-${this._esc(report.stock_code)}" style="height:180px;padding:4px 0"></div>`
      : '';

    el.innerHTML = `
      ${klineHtml}
      <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-b border-gray-100">
        <div class="flex items-center gap-2">
          <span class="text-base">${icon}</span>
          <span class="font-semibold text-sm text-gray-800">${this._esc(dim.name)}</span>
          ${dim.error ? '<span class="text-xs text-red-500">⚠️ 分析异常</span>' : ''}
        </div>
        <div class="flex items-center gap-2">
          ${this._scoreBadge(dim.score, dim.signal, 'sm')}
        </div>
      </div>

      ${dim.summary ? `
        <div class="px-4 py-2 border-b border-gray-100" style="background:var(--dim-sum-bg,#f9fafb)">
          <p class="text-xs text-gray-600 leading-relaxed">${this._esc(dim.summary)}</p>
        </div>
      ` : ''}

      <div class="divide-y divide-gray-100" id="sections-${dim.dimension}-${Math.random().toString(36).slice(2,7)}"></div>
    `;

    // 用随机 id 避免多个同维度冲突
    const sectionsEl = el.querySelector('[id^="sections-"]');
    if (dim.error) {
      sectionsEl.innerHTML = `<div class="px-4 py-3 text-sm text-red-500">${this._esc(dim.error)}</div>`;
    } else {
      (dim.sections || []).forEach(sec => sectionsEl.appendChild(this._renderSection(sec)));
    }

    return el;
  }

  _renderSection(sec) {
    const sig = SIGNAL_CONFIG[sec.signal] || SIGNAL_CONFIG.hold;
    const el = document.createElement('details');
    el.className = 'group';
    el.innerHTML = `
      <summary class="flex items-center justify-between px-4 py-2.5 cursor-pointer hover:bg-gray-50 select-none list-none">
        <div class="flex items-center gap-2">
          <span class="text-gray-400 group-open:rotate-90 transition-transform text-xs">▶</span>
          <span class="text-sm font-medium text-gray-700">${this._esc(sec.title)}</span>
        </div>
        <span class="text-xs px-1.5 py-0.5 rounded ${sig.bg} ${sig.text} font-medium">
          ${sig.label}
        </span>
      </summary>
      <div class="px-4 pb-3 pt-1 text-xs text-gray-600 leading-relaxed bg-gray-50/50">
        ${this._mdToHtml(sec.content)}
      </div>
    `;
    if (sec.score >= 65 || sec.score <= 35) {
      el.setAttribute('open', '');
    }
    return el;
  }

  _initRadar(rpt) {
    const el = this._container.querySelector('#radar-chart');
    if (!el || typeof echarts === 'undefined') return;
    const existing = echarts.getInstanceByDom(el);
    if (existing) existing.dispose();
    const chart = echarts.init(el);
    const dimScores = {};
    (rpt.dimensions || []).forEach(d => { dimScores[d.dimension] = d.score; });
    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: (p) => {
          const v = p.value;
          return `技术面: ${v[0]}<br/>基本面: ${v[1]}<br/>产业链: ${v[2]}`;
        },
      },
      radar: {
        indicator: [
          { name: '技术面', max: 100 },
          { name: '基本面', max: 100 },
          { name: '产业链', max: 100 },
        ],
        center: ['50%', '50%'], radius: '70%',
        axisName: { fontSize: 11, color: '#374151' },
        splitLine: { lineStyle: { color: '#e5e7eb' } },
        splitArea: { areaStyle: { color: ['rgba(239,246,255,0.3)', 'rgba(255,255,255,0)'] } },
        axisLine: { lineStyle: { color: '#d1d5db' } },
      },
      series: [{
        type: 'radar',
        data: [{
          value: [dimScores['technical'] ?? 0, dimScores['fundamental'] ?? 0, dimScores['industry'] ?? 0],
          name: '评分',
          itemStyle: { color: '#3b82f6' },
          lineStyle: { color: '#3b82f6', width: 2 },
          areaStyle: { color: 'rgba(59,130,246,0.18)' },
          symbol: 'circle', symbolSize: 5,
        }],
      }],
    });
  }

  _initKlineChart(rpt) {
    if (!rpt.kline_data || !rpt.kline_data.length) return;
    if (typeof echarts === 'undefined') return;
    const el = this._container.querySelector(`#kline-chart-${rpt.stock_code}`);
    if (!el) return;
    const existing = echarts.getInstanceByDom(el);
    if (existing) existing.dispose();
    const chart = echarts.init(el);
    const data  = rpt.kline_data.slice(-60);
    const dates = data.map(d => d.date ? d.date.slice(5) : '');
    const close  = data.map(d => d.close  ?? null);
    const ma5    = data.map(d => d.ma5    ?? null);
    const ma10   = data.map(d => d.ma10   ?? null);
    const ma20   = data.map(d => d.ma20   ?? null);
    const ma30   = data.map(d => d.ma30   ?? null);
    const ma60   = data.map(d => d.ma60   ?? null);
    const ma120  = data.map(d => d.ma120  ?? null);
    const ma250  = data.map(d => d.ma250  ?? null);
    const mkLine = (name, vals, color, w = 1.5) => ({
      name, type: 'line', data: vals, smooth: false, symbol: 'none',
      lineStyle: { color, width: w }, itemStyle: { color },
    });
    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'cross', crossStyle: { color: '#9ca3af' } },
        textStyle: { fontSize: 11 },
        formatter: (params) => {
          const idx = params[0].dataIndex;
          const date = data[idx]?.date || '';
          let html = `<div style="font-size:11px"><b>${date}</b></div>`;
          params.forEach(p => {
            if (p.value != null)
              html += `<div style="color:${p.color}">${p.seriesName}: ${Number(p.value).toFixed(2)}</div>`;
          });
          return html;
        },
      },
      legend: {
        data: ['收盘价', 'MA5', 'MA10', 'MA20', 'MA30', 'MA60', 'MA120', 'MA250'],
        right: 8, top: 2,
        textStyle: { fontSize: 10, color: '#6b7280' },
        itemWidth: 12, itemHeight: 3,
      },
      grid: { left: 8, right: 8, top: 28, bottom: 20, containLabel: true },
      xAxis: {
        type: 'category', data: dates,
        axisLabel: { fontSize: 9, color: '#9ca3af', interval: Math.floor(data.length / 6) },
        axisLine: { lineStyle: { color: '#e5e7eb' } }, splitLine: { show: false },
      },
      yAxis: {
        type: 'value', scale: true,
        axisLabel: { fontSize: 9, color: '#9ca3af', formatter: v => v.toFixed(1) },
        splitLine: { lineStyle: { color: '#f3f4f6' } },
      },
      series: [
        mkLine('收盘价', close, '#3b82f6', 2),
        mkLine('MA5',   ma5,   '#f97316', 1),
        mkLine('MA10',  ma10,  '#facc15', 1),
        mkLine('MA20',  ma20,  '#ef4444', 1),
        mkLine('MA30',  ma30,  '#f472b6', 1),
        mkLine('MA60',  ma60,  '#8b5cf6', 1),
        mkLine('MA120', ma120, '#06b6d4', 1),
        mkLine('MA250', ma250, '#6b7280', 1),
      ],
    });
  }

  _scoreBadge(score, signal, size = 'md') {
    const sig    = SIGNAL_CONFIG[signal] || SIGNAL_CONFIG.hold;
    const wh     = size === 'sm' ? 'w-8 h-8 text-xs' : 'w-12 h-12 text-sm';
    const color  = score >= 70 ? '#16a34a' : score >= 55 ? '#2563eb' : score >= 40 ? '#6b7280' : '#dc2626';
    const radius = size === 'sm' ? 14 : 20;
    const circum = 2 * Math.PI * radius;
    const dash   = (score / 100) * circum;
    return `
      <div class="flex items-center gap-1.5">
        <svg class="${wh}" viewBox="0 0 ${radius*2+8} ${radius*2+8}">
          <circle cx="${radius+4}" cy="${radius+4}" r="${radius}" fill="none" stroke="#e5e7eb" stroke-width="3"/>
          <circle cx="${radius+4}" cy="${radius+4}" r="${radius}" fill="none" stroke="${color}" stroke-width="3"
                  stroke-dasharray="${dash} ${circum}" stroke-dashoffset="${circum*0.25}" stroke-linecap="round"/>
          <text x="${radius+4}" y="${radius+4}" text-anchor="middle" dominant-baseline="central"
                font-size="${size==='sm'?9:11}" font-weight="bold" fill="${color}">${score}</text>
        </svg>
        <span class="text-xs px-1.5 py-0.5 rounded ${sig.bg} ${sig.text} font-medium">${sig.label}</span>
      </div>
    `;
  }

  _mdToHtml(md) {
    if (!md) return '';
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return md.split('\n').map(line => {
      if (/^#{1,3} (.+)/.test(line))   return `<p class="font-semibold text-gray-800 mt-2 mb-0.5">${esc(line.replace(/^#+\s/,''))}</p>`;
      if (/^\*\*(.+)\*\*$/.test(line)) return `<p class="font-semibold text-gray-800 mt-1">${esc(line.replace(/\*\*/g,''))}</p>`;
      if (/^[-*] (.+)/.test(line))     return `<p class="pl-2">• ${esc(line.slice(2))}</p>`;
      if (/^  [-*] (.+)/.test(line))   return `<p class="pl-5">◦ ${esc(line.trimStart().slice(2))}</p>`;
      if (line.trim() === '---')        return `<hr class="my-1 border-gray-200"/>`;
      if (line.trim() === '')           return '';
      let html = esc(line);
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/`(.+?)`/g, '<code class="bg-gray-200 px-0.5 rounded text-blue-700">$1</code>');
      html = html.replace(/(✅|🟢|🔵)/g, '<span class="text-green-600">$1</span>');
      html = html.replace(/(⚠️|🔴|❌|🟠)/g, '<span class="text-red-500">$1</span>');
      return `<p>${html}</p>`;
    }).filter(Boolean).join('\n');
  }

  _fmtTime(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString('zh-CN', {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
      });
    } catch { return iso; }
  }

  _esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
}

// ── js/store.js ──────────────────────────────
/**
 * store.js — 全局状态管理 + localStorage 持久化
 *
 * stock_list 结构（v2.1 起）：对象数组 [{code, name, checked}]
 *   - code:    股票代码（大写），唯一键
 *   - name:    股票名称（添加时自动查 /quote 填充，可空回退显示代码）
 *   - checked: 是否勾选参与"分析勾选自选股"批量任务（默认 true）
 * 向后兼容：旧数据是字符串数组 ["600519"]，_load 时自动迁移。
 *
 * ⚠️ toJSON() 导出到 config/watchlist.json 时把 stock_list 降维回
 *    纯代码字符串数组 ["600519",...]，因为 GitHub Action
 *    (portal-daily-analysis.yml) 读取它期望字符串数组。契约不能破。
 */

const KEY = 'dsa_portal_v2';

const DEFAULTS = {
  stock_list: [],   // [{code, name, checked}]
  report_type: 'simple',
  market_review_enabled: true,
  market_review_region: 'cn',
  analysis_delay: 0,
  max_workers: 1,
  force_run: false,
  llm_note_mode: 'batch',    // 逐指标LLM点评：batch(批量一次) | per_indicator(逐个详细)
  auto_open_html: true,      // 分析后自动用浏览器打开 HTML 报告
  email: { enabled: true, subject_prefix: 'A股智能分析' },
};

class Store {
  constructor() {
    this._state = this._load();
    this._subs = [];
  }

  get() { return structuredClone(this._state); }
  /** 别名，兼容历史调用（watchlist.js 曾误用 getState） */
  getState() { return this.get(); }

  // ── 自选股操作（对象数组）───────────────────────────────
  addStock(raw, name = '') {
    const code = String(raw || '').trim().toUpperCase();
    if (!code) return { ok: false, msg: '代码不能为空' };
    if (this._state.stock_list.some(s => s.code === code))
      return { ok: false, msg: `${code} 已存在` };
    this._state.stock_list = [...this._state.stock_list, { code, name: name || '', checked: true }];
    this._save(); this._emit(); return { ok: true };
  }

  removeStock(code) {
    this._state.stock_list = this._state.stock_list.filter(s => s.code !== code);
    this._save(); this._emit();
  }

  setStockName(code, name) {
    let changed = false;
    this._state.stock_list = this._state.stock_list.map(s => {
      if (s.code === code && name && s.name !== name) { changed = true; return { ...s, name }; }
      return s;
    });
    if (changed) { this._save(); this._emit(); }
  }

  toggleChecked(code, value) {
    this._state.stock_list = this._state.stock_list.map(s =>
      s.code === code ? { ...s, checked: (value === undefined ? !s.checked : !!value) } : s);
    this._save(); this._emit();
  }

  setAllChecked(value) {
    this._state.stock_list = this._state.stock_list.map(s => ({ ...s, checked: !!value }));
    this._save(); this._emit();
  }

  /** 返回勾选的股票 [{code, name, checked}] */
  getChecked() {
    return this._state.stock_list.filter(s => s.checked);
  }

  set(key, value) {
    if (key.includes('.')) {
      const [p, c] = key.split('.');
      this._state[p] = { ...this._state[p], [c]: value };
    } else {
      this._state[key] = value;
    }
    this._save(); this._emit();
  }

  subscribe(fn) { this._subs.push(fn); fn(this.get()); }

  /**
   * 导出到 config/watchlist.json。
   * ⚠️ stock_list 降维为纯代码字符串数组（GitHub Action 契约）。
   */
  toJSON() {
    const { stock_list, ...rest } = this._state;
    return JSON.stringify({
      _schema_version: '1',
      _comment: '由 portal/index.html 生成，提交到仓库后被 portal-daily-analysis.yml 读取',
      updated_at: new Date().toISOString(),
      ...rest,
      stock_list: stock_list.map(s => s.code),   // 降维：只导出代码
    }, null, 2);
  }

  _emit() { const s = this.get(); this._subs.forEach(f => f(s)); }

  _save() {
    try { localStorage.setItem(KEY, JSON.stringify(this._state)); } catch {}
  }

  _load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        parsed.stock_list = this._migrateStockList(parsed.stock_list);
        return this._merge(DEFAULTS, parsed);
      }
    } catch {}
    return structuredClone(DEFAULTS);
  }

  /** 把旧的字符串数组 ["600519"] 迁移为对象数组 [{code,name,checked}] */
  _migrateStockList(list) {
    if (!Array.isArray(list)) return [];
    return list.map(item => {
      if (typeof item === 'string') return { code: item.toUpperCase(), name: '', checked: true };
      if (item && typeof item === 'object' && item.code)
        return { code: String(item.code).toUpperCase(), name: item.name || '', checked: item.checked !== false };
      return null;
    }).filter(Boolean);
  }

  _merge(base, over) {
    const r = structuredClone(base);
    for (const k of Object.keys(over)) {
      if (k in r && typeof r[k] === 'object' && !Array.isArray(r[k]) && r[k] !== null)
        r[k] = this._merge(r[k], over[k]);
      else r[k] = over[k];
    }
    return r;
  }
}

const store = new Store();

// ── js/tabs/watchlist.js ──────────────────────────────
/**
 * tabs/watchlist.js — 选股管理
 *   - 每项 checkbox：勾选参与"分析勾选自选股"批量任务，状态持久化
 *   - 显示股票名称（store 持久化）优先，无名称回退代码
 *   - 添加时若本地服务在线，自动查 /quote 拿名称写回 store
 *   - 实时行情（价格/涨跌幅）在 server 在线时叠加显示
 */

class WatchlistTab {
  constructor(container, store, toast) {
    this._c = container; this._s = store; this._t = toast;
    this._online = false;
    this._quotes = {};   // { "600519": { name, price, pct_chg, volume } }
  }

  init() {
    this._c.innerHTML = `
      <div class="max-w-2xl mx-auto space-y-5 pb-20">
        <div>
          <h2 class="text-base font-semibold text-gray-900">自选股管理</h2>
          <p class="text-xs text-gray-500 mt-0.5">支持 A股（600519）、港股（00700）、美股（AAPL）· 勾选项可批量分析</p>
        </div>

        <!-- 输入区 -->
        <div class="flex gap-2">
          <input id="wl-input" type="text" placeholder="输入股票代码，如 600519" maxlength="12"
            class="form-input flex-1" autocomplete="off" />
          <button id="wl-add"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors">
            添加
          </button>
        </div>

        <!-- 全选 / 反选工具条 -->
        <div id="wl-toolbar" class="hidden items-center gap-3 text-xs text-gray-500">
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input id="wl-check-all" type="checkbox" class="w-4 h-4 accent-blue-600 cursor-pointer" />
            全选
          </label>
          <span id="wl-checked-count" class="text-gray-400"></span>
        </div>

        <!-- 列表 -->
        <div id="wl-list" class="space-y-1.5"></div>
        <p id="wl-count" class="text-xs text-gray-400"></p>
      </div>`;

    const input = this._c.querySelector('#wl-input');
    this._c.querySelector('#wl-add').addEventListener('click', () => this._add(input));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') this._add(input); });
    this._c.querySelector('#wl-check-all').addEventListener('change', e => {
      this._s.setAllChecked(e.target.checked);
    });
    this._s.subscribe(state => this._render(state));

    // 初始尝试加载行情
    this._loadQuotes();
  }

  /** 由 app 层在服务器状态变更时调用 */
  setServerStatus(online) {
    this._online = online;
    if (online) this._loadQuotes();
  }

  async _loadQuotes() {
    const state = this._s.get();
    const stocks = (state && state.stock_list) ? state.stock_list : [];
    if (!stocks.length) return;
    // 不依赖 _online 标志（可能未同步）；直接尝试，失败静默

    try {
      const codes = stocks.map(s => s.code).join(',');
      const res = await fetch(`${SERVER}/quote?codes=${encodeURIComponent(codes)}`);
      if (!res.ok) return;
      const data = await res.json();
      if (!data.ok || !Array.isArray(data.quotes)) return;

      const map = {};
      for (const q of data.quotes) {
        map[q.code] = { name: q.name, price: q.price, pct_chg: q.pct_chg, volume: q.volume };
        // 行情带回名称 → 持久化到 store（若该股尚无名称）
        if (q.name) this._s.setStockName(q.code, q.name);
      }
      this._quotes = map;
      this._render(this._s.get());
    } catch (_) { /* 网络失败静默 */ }
  }

  _add(input) {
    const raw = input.value;
    const r = this._s.addStock(raw);
    if (r.ok) {
      const code = raw.trim().toUpperCase();
      input.value = '';
      this._t.show('已添加', 'success');
      // server 在线：立即查该股名称 + 行情
      this._fetchName(code);
      this._loadQuotes();
    } else {
      this._t.show(r.msg, 'warning');
    }
  }

  /** 添加时查单只股票名称，写回 store 持久化 */
  async _fetchName(code) {
    // 不依赖 _online（懒加载 Tab 可能未收到 setServerStatus）；直接试，失败静默
    try {
      const res = await fetch(`${SERVER}/quote?codes=${encodeURIComponent(code)}`);
      if (!res.ok) return;
      const data = await res.json();
      const q = (data.quotes || [])[0];
      if (q && q.name) this._s.setStockName(code, q.name);
    } catch (_) {}
  }

  _render(state) {
    const list  = this._c.querySelector('#wl-list');
    const count = this._c.querySelector('#wl-count');
    const toolbar = this._c.querySelector('#wl-toolbar');
    if (!list) return;
    const stocks = state.stock_list || [];
    if (!stocks.length) {
      list.innerHTML = `
        <div class="py-12 text-center text-gray-300">
          <div class="text-4xl mb-2">📋</div>
          <p class="text-sm">还没有自选股</p>
        </div>`;
      if (count) count.textContent = '';
      if (toolbar) toolbar.classList.add('hidden');
      return;
    }

    if (toolbar) toolbar.classList.remove('hidden');

    list.innerHTML = stocks.map((s, i) => {
      const code = s.code;
      const q = this._quotes[code] || {};
      // 显示名优先级：store 持久化名 > 行情名 > 代码
      const displayName = s.name || q.name || '';
      const nameHtml = displayName
        ? `<span class="font-semibold text-sm text-gray-800">${this._esc(displayName)}</span>
           <span class="ml-1.5 font-mono text-xs text-gray-400">${this._esc(code)}</span>`
        : `<span class="font-mono font-semibold text-sm text-gray-800">${this._esc(code)}</span>`;

      let priceHtml = '';
      if (q.price != null) {
        priceHtml = `<span class="text-xs text-gray-600 font-mono">${q.price.toFixed(2)}</span>`;
      }
      let pctHtml = '';
      if (q.pct_chg != null) {
        const sign  = q.pct_chg >= 0 ? '+' : '';
        const color = q.pct_chg > 0 ? 'text-green-500' : q.pct_chg < 0 ? 'text-red-500' : 'text-gray-400';
        pctHtml = `<span class="text-xs font-semibold ${color}">${sign}${q.pct_chg.toFixed(2)}%</span>`;
      }
      const hasQuote = priceHtml || pctHtml;

      return `
        <div class="flex items-center justify-between px-4 py-2.5 bg-white rounded-xl border border-gray-100
                    hover:border-blue-200 hover:shadow-sm transition-all group">
          <div class="flex items-center gap-3 min-w-0">
            <input type="checkbox" data-check="${this._esc(code)}" ${s.checked ? 'checked' : ''}
              class="w-4 h-4 accent-blue-600 cursor-pointer shrink-0" />
            <span class="text-xs text-gray-300 w-4 text-right shrink-0">${i + 1}</span>
            <div class="flex flex-col min-w-0">
              <div class="flex items-center gap-1.5">${nameHtml}</div>
              ${hasQuote ? `<div class="flex items-center gap-1.5 mt-0.5">${priceHtml}${pctHtml}</div>` : ''}
            </div>
          </div>
          <button data-del="${this._esc(code)}"
            class="text-gray-200 hover:text-red-400 transition-colors text-lg leading-none opacity-0 group-hover:opacity-100 shrink-0">×</button>
        </div>`;
    }).join('');

    // 绑定 checkbox
    list.querySelectorAll('[data-check]').forEach(cb =>
      cb.addEventListener('change', () => this._s.toggleChecked(cb.dataset.check, cb.checked)));
    // 绑定删除
    list.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', () => {
        this._s.removeStock(b.dataset.del);
        this._t.show('已移除', 'info');
      }));

    // 更新计数 + 全选态
    const checkedN = stocks.filter(s => s.checked).length;
    if (count) count.textContent = `共 ${stocks.length} 只`;
    const cntEl = this._c.querySelector('#wl-checked-count');
    if (cntEl) cntEl.textContent = `已勾选 ${checkedN} 只`;
    const allEl = this._c.querySelector('#wl-check-all');
    if (allEl) {
      allEl.checked = checkedN === stocks.length && stocks.length > 0;
      allEl.indeterminate = checkedN > 0 && checkedN < stocks.length;
    }
  }

  _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

  _row(label, control, hint = '') {
    return `
      <div class="flex items-center justify-between px-5 py-3.5 gap-4">
        <div class="flex-shrink-0">
          <p class="text-sm font-medium text-gray-700">${label}</p>
          ${hint ? `<p class="text-xs text-gray-400 mt-0.5">${hint}</p>` : ''}
        </div>
        <div class="flex-shrink-0">${control}</div>
      </div>`;
  }

  _bindToggle(btnId, thumbId, hiddenId, onChange) {
    const btn    = this._c.querySelector(`#${btnId}`);
    const thumb  = this._c.querySelector(`#${thumbId}`);
    const hidden = this._c.querySelector(`#${hiddenId}`);
    if (!btn) return;
    const setOn = (on) => {
      hidden.checked = on;
      btn.setAttribute('aria-checked', String(on));
      btn.classList.toggle('bg-blue-500', on);
      btn.classList.toggle('bg-gray-200', !on);
      thumb.classList.toggle('translate-x-5', on);
      thumb.classList.toggle('translate-x-0', !on);
      onChange(on);
    };
    btn.addEventListener('click', () => setOn(!hidden.checked));
  }

  _bindInput(id, key, xf = v => v) {
    const el = this._c.querySelector(`#${id}`);
    if (!el) return;
    el.addEventListener('input', () => this._s.set(key, xf(el.value)));
  }

  _sync(state) {
    const sv = (id, val) => { const el = this._c.querySelector(`#${id}`); if (el) el.value = val ?? ''; };
    sv('cfg-report-type',   state.report_type);
    sv('cfg-llm-mode',      state.llm_note_mode || 'batch');
    sv('cfg-market-region', state.market_review_region);
    sv('cfg-workers',       state.max_workers);
    sv('cfg-delay',         state.analysis_delay);
    sv('cfg-email-prefix',  state.email?.subject_prefix ?? 'A股智能分析');

    this._applyToggle('cfg-market-review-btn', 'cfg-market-thumb', 'cfg-market-review',
      !!state.market_review_enabled,
      (on) => { const l = this._c.querySelector('#cfg-market-label'); if (l) l.textContent = on ? '已启用' : '已关闭'; });
    this._applyToggle('cfg-force-btn', 'cfg-force-thumb', 'cfg-force', !!state.force_run);
    this._applyToggle('cfg-openhtml-btn', 'cfg-openhtml-thumb', 'cfg-openhtml',
      state.auto_open_html !== false,
      (on) => { const l = this._c.querySelector('#cfg-openhtml-label'); if (l) l.textContent = on ? '已启用' : '已关闭'; });
  }

  _applyToggle(btnId, thumbId, hiddenId, on, sideEffect) {
    const btn    = this._c.querySelector(`#${btnId}`);
    const thumb  = this._c.querySelector(`#${thumbId}`);
    const hidden = this._c.querySelector(`#${hiddenId}`);
    if (!btn) return;
    hidden.checked = on;
    btn.setAttribute('aria-checked', String(on));
    btn.classList.toggle('bg-blue-500', on);
    btn.classList.toggle('bg-gray-200', !on);
    thumb.classList.toggle('translate-x-5', on);
    thumb.classList.toggle('translate-x-0', !on);
    sideEffect?.(on);
  }

  /** 渲染单个 .env 字段行 */
  _envField(key, label, type = 'text', help = '') {
    return `
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">${label}</label>
        <input type="${type}" id="env-${key}" autocomplete="off" spellcheck="false"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent font-mono"
          placeholder="${key}" />
        ${help ? `<p class="text-xs text-gray-400 mt-1">${help}</p>` : ''}
      </div>`;
  }

  /** 从 /env 读取掩码值填充各 input */
  async _loadEnvStatus() {
    const status = this._c.querySelector('#env-status');
    try {
      const res = await fetch(`${SERVER}/env`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const env = data.env || data;
      const keys = [
        'HAI_BASE_URL','HAI_API_KEY','HAI_MODEL',
        'GEMINI_API_KEY','DEEPSEEK_API_KEY','OPENAI_API_KEY',
        'BOCHA_API_KEYS','TAVILY_API_KEYS',
        'EMAIL_SENDER','EMAIL_PASSWORD','EMAIL_RECEIVERS'
      ];
      keys.forEach(k => {
        const el = this._c.querySelector(`#env-${k}`);
        if (el && env[k]) el.value = env[k];
      });
      if (status) status.textContent = '已从服务器读取';
    } catch (e) {
      if (status) status.textContent = `读取失败：${e.message}（本地服务未启动？）`;
    }
  }

  /** 收集非空 input 值，POST /env 保存 */
  async _saveEnv() {
    const status = this._c.querySelector('#env-status');
    const keys = [
      'HAI_BASE_URL','HAI_API_KEY','HAI_MODEL',
      'GEMINI_API_KEY','DEEPSEEK_API_KEY','OPENAI_API_KEY',
      'BOCHA_API_KEYS','TAVILY_API_KEYS',
      'EMAIL_SENDER','EMAIL_PASSWORD','EMAIL_RECEIVERS'
    ];
    const payload = {};
    keys.forEach(k => {
      const el = this._c.querySelector(`#env-${k}`);
      // 掩码值（含 *）不回传，避免把掩码写进 .env
      if (el && el.value.trim() && !el.value.includes('*')) payload[k] = el.value.trim();
    });
    if (status) status.textContent = '保存中...';
    try {
      const res = await fetch(`${SERVER}/env`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      this._t?.show('已保存到 .env，分析将自动使用', 'success');
      if (status) status.textContent = '保存成功';
    } catch (e) {
      this._t?.show(`保存失败：${e.message}（请确认本地服务已启动）`, 'error');
      if (status) status.textContent = `保存失败：${e.message}`;
    }
  }
}
