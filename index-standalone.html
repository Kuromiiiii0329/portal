  // ── 子面板切换 ────────────────────────────────────────────────────────
  _switchSubTab(name) {
    this._activeSub = name;
    ['analyze','log','report'].forEach(p => {
      const el  = this._c.querySelector(`#sub-${p}`);
      const btn = this._c.querySelector(`[data-sub="${p}"]`);
      if (!el || !btn) return;
      const active = p === name;
      el.classList.toggle('hidden', !active);
      if (active) {
        btn.classList.remove('text-gray-500');
        btn.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      } else {
        btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
        btn.classList.add('text-gray-500');
      }
    });
    if (name === 'log')    this._c.querySelector('#tab-log-badge')?.classList.add('hidden');
    if (name === 'report') this._c.querySelector('#tab-report-badge')?.classList.add('hidden');
  }

  // ── 维度选择器 ────────────────────────────────────────────────────────
  _buildDims() {
    const list = this._c.querySelector('#dim-list');
    Object.entries(DIM_DEFS).forEach(([dimKey, dimDef]) => {
      const c = dimDef.color || 'blue';
      const wrap = document.createElement('div');
      wrap.className = 'border border-gray-100 rounded-xl overflow-hidden';
      const checked = this._selDims.has(dimKey);
      wrap.innerHTML = `
        <div class="flex items-center gap-3 px-3 py-2 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors"
             data-dim="${dimKey}">
          <input type="checkbox" id="dim-${dimKey}" ${checked ? 'checked' : ''}
            class="w-4 h-4 accent-${c}-600 cursor-pointer" />
          <label for="dim-${dimKey}" class="text-xs font-medium text-gray-700 cursor-pointer flex-1 select-none">
            ${dimDef.label}
          </label>
          <span class="text-xs text-gray-400">▼</span>
        </div>
        <div class="dim-mods ${checked ? '' : 'hidden'} px-3 py-2 grid grid-cols-2 sm:grid-cols-3 gap-1.5 bg-white"
             data-dim="${dimKey}">
          ${Object.entries(dimDef.mods).map(([mk, ml]) => `
            <label class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer hover:text-${c}-600">
              <input type="checkbox" class="mod-cb accent-${c}-600 w-3.5 h-3.5"
                data-dim="${dimKey}" data-mod="${mk}"
                ${this._selMods[dimKey]?.has(mk) ? 'checked' : ''} />
              ${ml}
            </label>`).join('')}
        </div>`;
      list.appendChild(wrap);
    });

    list.querySelectorAll('[data-dim]').forEach(row => {
      if (row.classList.contains('dim-mods')) return;
      row.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') return;
        const cb = row.querySelector('input[type=checkbox]');
        cb.checked = !cb.checked; cb.dispatchEvent(new Event('change'));
      });
    });
    list.querySelectorAll('[id^="dim-"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const k = cb.id.replace('dim-', '');
        const modsEl = list.querySelector(`.dim-mods[data-dim="${k}"]`);
        cb.checked ? this._selDims.add(k) : this._selDims.delete(k);
        modsEl?.classList.toggle('hidden', !cb.checked);
        this._updateDimsCount();
      });
    });
    list.querySelectorAll('.mod-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const { dim, mod } = cb.dataset;
        cb.checked ? this._selMods[dim]?.add(mod) : this._selMods[dim]?.delete(mod);
      });
    });
  }

  _updateDimsCount() {
    const el = this._c.querySelector('#dims-count');
    if (el) el.textContent = this._selDims.size;
  }

  _setDims(keys) {
    const all = Object.keys(DIM_DEFS);
    this._selDims = new Set(keys.filter(k => all.includes(k)));
    const list = this._c.querySelector('#dim-list');
    if (!list) return;
    all.forEach(k => {
      const cb    = list.querySelector(`#dim-${k}`);
      const mods  = list.querySelector(`.dim-mods[data-dim="${k}"]`);
      const on    = this._selDims.has(k);
      if (cb) cb.checked = on;
      mods?.classList.toggle('hidden', !on);
    });
    this._updateDimsCount();
    this._t.show(`已切换到：${keys.join(' + ')}`, 'info', 1800);
  }

  // ── 自选股芯片 ────────────────────────────────────────────────────────
  _syncChips(state) {
    const chips = this._c.querySelector('#run-chips');
    if (!chips) return;
    const stocks = state.stock_list || [];
    if (!stocks.length) {
      chips.innerHTML = '<span class="text-xs text-gray-300">（自选股为空，先去「自选股」Tab 添加）</span>';
      return;
    }
    chips.innerHTML = stocks.map(s => {
      const label = s.name ? `${this._esc(s.name)}` : s.code;
      return `<button class="chip px-2.5 py-1 text-xs border border-gray-200 rounded-lg text-gray-600"
              data-code="${s.code}" data-name="${this._esc(s.name || '')}">${label}</button>`;
    }).join('');
    chips.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        this._c.querySelector('#run-code').value = btn.dataset.code;
        const nameEl = this._c.querySelector('#run-name');
        if (nameEl) nameEl.value = btn.dataset.name || '';
        chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('selected', b === btn));
      });
    });
  }

  _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── 在线状态 UI ───────────────────────────────────────────────────────
  _updateOnlineUI() {
    const dot   = this._c.querySelector('#run-dot');
    const label = this._c.querySelector('#run-svc-label');
    const chip  = this._c.querySelector('#run-svc-chip');
    if (!dot) return;
    if (this._online) {
      dot.className     = 'status-dot online';
      label.textContent = '本地服务在线';
      chip.className    = chip.className.replace(/bg-\S+|border-\S+|text-\S+/g, '').trim()
        + ' bg-green-50 border-green-200 text-green-700';
    } else {
      dot.className     = 'status-dot offline';
      label.textContent = '纯静态模式';
      chip.className    = chip.className.replace(/bg-\S+|border-\S+|text-\S+/g, '').trim()
        + ' bg-gray-50 border-gray-200 text-gray-400';
    }
  }

  // ── 事件绑定 ──────────────────────────────────────────────────────────
  _bindEvents() {
    // 子 Tab 切换
    this._c.querySelectorAll('.sub-tab').forEach(btn => {
      btn.addEventListener('click', () => this._switchSubTab(btn.dataset.sub));
    });

    // 快捷维度按钮
    this._c.querySelectorAll('.dim-quick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const dq = btn.dataset.dq;
        if (dq === 'all')         this._setDims(['technical','fundamental','industry']);
        else if (dq === 'fund+ind') this._setDims(['fundamental','industry']);
        else                      this._setDims([dq]);
      });
    });

    // 分析按钮
    this._c.querySelector('#btn-deep').addEventListener('click',   () => this._deepAnalyze());
    this._c.querySelector('#btn-market').addEventListener('click', () => this._marketReview());
    this._c.querySelector('#btn-full').addEventListener('click',   () => this._quickRun('full'));
    this._c.querySelector('#btn-batch').addEventListener('click',  () => this._batchAnalyze());
    this._c.querySelector('#run-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') this._deepAnalyze();
    });

    // 日志清空
    this._c.querySelector('#btn-clear-log').addEventListener('click', () => {
      this._c.querySelector('#log-box').innerHTML = '';
    });

    // 复制报告
    this._c.querySelector('#btn-copy-report').addEventListener('click', async () => {
      const mbox = this._c.querySelector('#report-markdown');
      const sbox = this._c.querySelector('#report-structured');
      try {
        await navigator.clipboard.writeText(mbox.dataset.raw || sbox.innerText || '');
        this._t.show('已复制', 'success');
      } catch { this._t.show('复制失败', 'warning'); }
    });

    // 视图切换
    this._c.querySelector('#btn-view-structured').addEventListener('click', () => this._setViewMode('structured'));
    this._c.querySelector('#btn-view-markdown').addEventListener('click',   () => this._setViewMode('markdown'));

    // 历史清空
    this._c.querySelector('#btn-clear-history')?.addEventListener('click', () => {
      localStorage.removeItem(HISTORY_KEY);
      this._renderHistory();
    });

    // 回测
    this._c.querySelector('#btn-backtest').addEventListener('click', () => this._runBacktest());
    this._c.querySelector('#bt-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') this._runBacktest();
    });
    // 同步深度分析的股票代码到回测输入框
    this._c.querySelector('#run-code').addEventListener('input', e => {
      const btCode = this._c.querySelector('#bt-code');
      if (!btCode.value) btCode.value = e.target.value;
    });
  }

  // ── 回测 ────────────────────────────────────────────────────────────
  async _runBacktest() {
    const code = (this._c.querySelector('#bt-code').value || '').trim();
    if (!code) { this._t.show('请输入股票代码', 'warning'); return; }

    const loading = this._c.querySelector('#bt-loading');
    const errEl   = this._c.querySelector('#bt-error');
    const resEl   = this._c.querySelector('#bt-result');
    const noteEl  = this._c.querySelector('#bt-note');
    const btn     = this._c.querySelector('#btn-backtest');

    loading.classList.remove('hidden');
    errEl.classList.add('hidden');
    resEl.classList.add('hidden');
    btn.disabled = true;

    try {
      const res = await fetch(`${SERVER}/backtest?code=${encodeURIComponent(code)}`);
      const data = await res.json();
      loading.classList.add('hidden');
      btn.disabled = false;

      if (!res.ok || data.ok === false || data.error) {
        errEl.textContent = '❌ ' + (data.error || `请求失败（HTTP ${res.status}）`);
        errEl.classList.remove('hidden');
        noteEl.textContent = '请先对该股票运行一次深度分析';
        return;
      }
      // 后端返回结构为 { ok, code, backtest: { signals, total_days, stock_days } }，
      // 回测结果字段都在 backtest 层；兼容旧的平铺结构。
      const bt = data.backtest || data;
      noteEl.textContent = `数据区间：${bt.stock_days}  共 ${bt.total_days} 个交易日`;
      this._renderBacktestResult(bt);
    } catch (e) {
      loading.classList.add('hidden');
      btn.disabled = false;
      errEl.textContent = '❌ 请求失败：' + e.message + '（请确认本地服务已启动）';
      errEl.classList.remove('hidden');
    }
  }

  _renderBacktestResult(data) {
    const resEl   = this._c.querySelector('#bt-result');
    const metaEl  = this._c.querySelector('#bt-meta');
    const chartEl = this._c.querySelector('#bt-chart');
    const tableEl = this._c.querySelector('#bt-table');

    resEl.classList.remove('hidden');
    metaEl.textContent = `数据区间：${data.stock_days}  共 ${data.total_days} 个交易日`;

    const signals = data.signals || {};
    const names   = Object.keys(signals).filter(k => signals[k].count > 0);
    const days    = ['1', '3', '5', '10', '20'];
    const colors  = { '1': '#a855f7', '3': '#ec4899', '5': '#3b82f6', '10': '#f59e0b', '20': '#10b981' };

    // ── ECharts 柱状图：各信号 × 三个持有期的胜率 ──────────────
    if (typeof echarts !== 'undefined' && names.length > 0) {
      const chart = echarts.init(chartEl);
      chart.setOption({
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          formatter: params => {
            let s = `<b>${params[0].axisValue}</b><br/>`;
            params.forEach(p => { s += `${p.marker}${p.seriesName}日胜率：<b>${p.value}%</b><br/>`; });
            return s;
          }
        },
        legend: {
          data: days.map(d => d + '日胜率'),
          textStyle: { fontSize: 11 },
          bottom: 0,
        },
        grid: { left: 10, right: 10, top: 16, bottom: 36, containLabel: true },
        xAxis: {
          type: 'category',
          data: names,
          axisLabel: { fontSize: 10, rotate: names.length > 5 ? 15 : 0, overflow: 'break', width: 80 },
        },
        yAxis: {
          type: 'value', min: 0, max: 100,
          axisLabel: { formatter: '{value}%', fontSize: 10 },
          splitLine: { lineStyle: { color: '#f0f0f0' } },
        },
        series: days.map(d => ({
          name: d + '日胜率',
          type: 'bar',
          barGap: '5%',
          barCategoryGap: '30%',
          itemStyle: { color: colors[d], borderRadius: [3, 3, 0, 0] },
          data: names.map(n => signals[n].stats?.[d]?.win_rate ?? 0),
          label: { show: true, position: 'top', fontSize: 9,
                   formatter: p => p.value > 0 ? p.value + '%' : '' },
        })),
      });
      window.addEventListener('resize', () => chart.resize());
    } else {
      chartEl.innerHTML = '<div class="text-xs text-gray-400 text-center py-8">无信号触发记录</div>';
    }

    // ── 明细表格 ────────────────────────────────────────────────
    const rows = names.map(n => {
      const s = signals[n];
      const stat = s.stats || {};
      return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
        <td class="px-3 py-2 text-xs font-medium text-gray-700 whitespace-nowrap">${n}</td>
        <td class="px-3 py-2 text-xs text-center text-gray-500">${s.count}</td>
        ${days.map(d => {
          const w  = stat[d]?.win_rate  ?? '-';
          const r  = stat[d]?.avg_return ?? '-';
          const wc = typeof w === 'number' ? (w >= 60 ? 'text-emerald-600 font-semibold' : w < 45 ? 'text-red-500' : 'text-gray-600') : 'text-gray-400';
          const rc = typeof r === 'number' ? (r > 0 ? 'text-emerald-600' : r < 0 ? 'text-red-500' : 'text-gray-500') : 'text-gray-400';
          return `<td class="px-2 py-2 text-xs text-center ${wc}">${typeof w === 'number' ? w + '%' : w}</td>
                  <td class="px-2 py-2 text-xs text-center ${rc}">${typeof r === 'number' ? (r > 0 ? '+' : '') + r + '%' : r}</td>`;
        }).join('')}
      </tr>`;
    }).join('');

    const allZero = names.length === 0;
    tableEl.innerHTML = allZero
      ? '<p class="text-xs text-gray-400 text-center py-4">历史数据中未触发任何信号</p>'
      : `<table class="w-full text-left border-collapse">
           <thead>
             <tr class="bg-gray-50 text-xs text-gray-500">
               <th class="px-3 py-2 font-medium">信号名称</th>
               <th class="px-3 py-2 font-medium text-center">触发次数</th>
               ${days.map(d =>
                 `<th class="px-2 py-2 font-medium text-center" colspan="2">${d} 日持有</th>`
               ).join('')}
             </tr>
             <tr class="bg-gray-50 text-xs text-gray-400 border-b border-gray-100">
               <th></th><th></th>
               ${days.map(() => '<th class="px-2 py-1 text-center">胜率</th><th class="px-2 py-1 text-center">均收益</th>').join('')}
             </tr>
           </thead>
           <tbody>${rows}</tbody>
         </table>
         <p class="text-xs text-gray-400 mt-2 px-1">胜率≥60% 绿色 · <45% 红色；均收益正负对应涨跌</p>`;
  }

  // ── 视图切换（结构化 / Markdown）────────────────────────────────────
  _setViewMode(mode) {
    this._viewMode = mode;
    const btnS = this._c.querySelector('#btn-view-structured');
    const btnM = this._c.querySelector('#btn-view-markdown');
    const sbox = this._c.querySelector('#report-structured');
    const mbox = this._c.querySelector('#report-markdown');

    if (mode === 'structured') {
      btnS.className = btnS.className.replace('bg-white text-gray-500 hover:bg-gray-50','') + ' bg-blue-600 text-white';
      btnM.className = btnM.className.replace('bg-blue-600 text-white','') + ' bg-white text-gray-500 hover:bg-gray-50';
      sbox.classList.remove('hidden');
      mbox.classList.add('hidden');
    } else {
      btnM.className = btnM.className.replace('bg-white text-gray-500 hover:bg-gray-50','') + ' bg-blue-600 text-white';
      btnS.className = btnS.className.replace('bg-blue-600 text-white','') + ' bg-white text-gray-500 hover:bg-gray-50';
      mbox.classList.remove('hidden');
      sbox.classList.add('hidden');
      if (!mbox.dataset.raw && this._lastRawReport && this._lastRtype === 'structured') {
        mbox.dataset.raw = typeof this._lastRawReport === 'string'
          ? this._lastRawReport
          : JSON.stringify(this._lastRawReport, null, 2);
        mbox.innerHTML = this._md(mbox.dataset.raw);
      }
    }
  }

  // ── 自动启动 server ───────────────────────────────────────────────────
  async _ensureServer() {
    if (this._online) return true;
    if (this._serverStarting) {
      this._t.show('正在等待本地服务启动...', 'warning');
      return false;
    }
    this._serverStarting = true;
    this._t.show('需要本地服务，请运行：python portal/server.py', 'warning', 8000);

    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1000));
      try {
        const r = await fetch(`${SERVER}/health`, { signal: AbortSignal.timeout(1000) });
        if (r.ok) {
          this._online = true;
          this._serverStarting = false;
          this._updateOnlineUI();
          window.dispatchEvent(new CustomEvent('server-online'));
          return true;
        }
      } catch {}
    }
    this._serverStarting = false;
    this._t.show('本地服务未启动，请先运行 server.py', 'error');
    return false;
  }

  // ── 深度分析（单股，读输入框）──────────────────────────────────────────
  async _deepAnalyze() {
    const code = this._c.querySelector('#run-code').value.trim().toUpperCase();
    const name = this._c.querySelector('#run-name').value.trim();
    if (!code) { this._t.show('请输入股票代码', 'warning'); return; }

    const dims = [...this._selDims];
    if (!dims.length) { this._t.show('请至少选择一个分析维度', 'warning'); return; }

    const ok = await this._ensureServer();
    if (!ok) return;

    await this._runSingle(code, name || code, dims);
  }

  // ── 批量分析勾选的自选股（串行队列）──────────────────────────────────
  async _batchAnalyze() {
    const dims = [...this._selDims];
    if (!dims.length) { this._t.show('请至少选择一个分析维度', 'warning'); return; }

    const state = this._s.get();
    const checked = (state.stock_list || []).filter(s => s.checked);
    if (!checked.length) {
      this._t.show('请先在「自选股」Tab 勾选要分析的股票', 'warning');
      return;
    }

    const ok = await this._ensureServer();
    if (!ok) return;

    this._prepareLog(`📑 批量分析 ${checked.length} 只自选股`);
    this._disableBtns();

    let done = 0, failed = 0;
    for (const s of checked) {
      done++;
      this._disableBtns();   // 每只前重新禁用（_runSingle 内 SSE done 会解禁）
      this._appendLog(`──────── (${done}/${checked.length}) ${s.name || s.code} ────────`, 'info');
      try {
        const okOne = await this._runSingle(s.code, s.name || s.code, dims, { batch: true });
        if (!okOne) failed++;
      } catch (e) {
        failed++;
        this._appendLog(`❌ ${s.code} 分析异常：${e.message}`, 'error');
      }
    }

    const badge = this._c.querySelector('#run-badge');
    badge.textContent = `批量完成 ${done - failed}/${done}`;
    badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${failed ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`;
    this._resetBtns();
    this._t.show(`批量分析完成：成功 ${done - failed} / 共 ${done}`, failed ? 'warning' : 'success', 6000);
    // 批量结束切到报告页看最近历史
    this._switchSubTab('report');
  }

  /**
   * 分析单只股票 → Promise<boolean>（成功 true / 失败 false，永不 reject）。
   * 供单股按钮和批量队列共用。batch=true 时不重置日志（保留队列上下文）。
   */
  async _runSingle(code, name, dims, { batch = false } = {}) {
    const modulesMap = Object.fromEntries(dims.map(d => [d, [...(this._selMods[d] || [])]]));
    if (!batch) {
      this._prepareLog(`🔬 深度分析：${name || code}（${code}）`);
    } else {
      this._appendLog(`🔬 深度分析：${name || code}（${code}）`, 'info');
    }

    let taskId;
    try {
      const res = await fetch(`${SERVER}/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stock_code: code, stock_name: name || code, dimensions: dims, modules: modulesMap,
          llm_mode: this._s.get().llm_note_mode || 'batch',
          open_report: this._s.get().auto_open_html !== false,
          agent_review: !!this._c.querySelector('#chk-agent-review')?.checked }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      taskId = d.task_id;
    } catch (e) {
      this._appendLog(`❌ 启动失败：${e.message}`, 'error');
      if (!batch) { this._t.show(`启动失败: ${e.message}`, 'error'); this._resetBtns(); }
      return false;
    }
    return this._listenSSE(taskId, 'structured', code, name || code);
  }

  // ── 快速任务 ──────────────────────────────────────────────────────────
  async _quickRun(mode) {
    const ok = await this._ensureServer();
    if (!ok) return;

    const label = mode === 'market' ? '🌐 大盘复盘' : '⚡ 全量分析';
    this._prepareLog(label);

    let taskId;
    try {
      const res = await fetch(`${SERVER}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, force_run: false, no_notify: true }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      taskId = d.task_id;
    } catch (e) {
      this._t.show(`启动失败: ${e.message}`, 'error');
      this._resetBtns(); return;
    }
    this._listenSSE(taskId, 'markdown', '', label);
  }

  // ── 大盘复盘（新链路：上证+创业板，生成HTML）──────────────────────────
  async _marketReview() {
    const ok = await this._ensureServer();
    if (!ok) return;
    this._prepareLog('🌐 大盘复盘（上证指数 + 创业板指）');
    let taskId;
    try {
      const res = await fetch(`${SERVER}/market_review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ open_report: this._s.get().auto_open_html !== false }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      taskId = d.task_id;
    } catch (e) {
      this._t.show(`启动失败: ${e.message}`, 'error');
      this._resetBtns(); return;
    }
    this._listenSSE(taskId, 'market', '__market__', '大盘复盘');
  }

  // ── 日志区准备（切换到日志子面板）──────────────────────────────────
  _prepareLog(title) {
    if (this._sse) { this._sse.close(); this._sse = null; }
    this._c.querySelector('#log-box').innerHTML = '';
    this._c.querySelector('#report-structured').innerHTML = '';
    const badge = this._c.querySelector('#run-badge');
    badge.textContent = '运行中';
    badge.className = 'text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium';
    this._appendLog(title, 'info');
    this._disableBtns();
    // 自动切换到日志子面板
    this._switchSubTab('log');
  }

  // ── SSE 监听（返回 Promise，done/error 都 resolve，供批量队列 await）──
  _listenSSE(taskId, rtype, code = '', subject = '') {
    return new Promise((resolve) => {
      const sse = new EventSource(`${SERVER}/run/stream/${taskId}`);
      this._sse = sse;
      let settled = false;
      const finish = (ok) => { if (!settled) { settled = true; resolve(ok); } };

      sse.onmessage = e => {
        const d = JSON.parse(e.data);
        this._appendLog(d.log, d.status === 'error' ? 'error' : 'default');
      };
      sse.addEventListener('done', e => {
        sse.close(); this._sse = null;
        const d = JSON.parse(e.data);
        const ok = d.status === 'done';
        const badge = this._c.querySelector('#run-badge');
        badge.textContent = ok ? '完成 ✓' : '失败 ✗';
        badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
        this._resetBtns();
        if (d.has_report) {
          this._loadReport(taskId, d.report_type || rtype, code, subject).finally(() => finish(ok));
        } else {
          finish(ok);
        }
      });
      sse.onerror = () => {
        sse.close(); this._sse = null;
        this._appendLog('⚠️ 连接断开，拉取结果...', 'warn');
        setTimeout(() => {
          this._loadReport(taskId, rtype, code, subject).finally(() => finish(false));
        }, 600);
        this._resetBtns();
      };
    });
  }

  async _loadReport(taskId, rtype, code = '', subject = '') {
    try {
      const res = await fetch(`${SERVER}/run/report/${taskId}`);
      const d = await res.json();
      const box = this._c.querySelector('#log-box');
      if (d.logs) {
        const ex = box.children.length;
        d.logs.slice(ex).forEach(l => this._appendLog(l));
      }
      if (d.report) {
        this._lastRtype = rtype;
        if (rtype === 'market') {
          // 大盘：HTML 已在浏览器打开，portal 内不渲染，只提示 + 记历史
          this._t.show('大盘复盘完成，HTML 已在浏览器打开', 'success', 5000);
          this._saveHistory({ code: '__market__', name: '大盘复盘', score: null, signal: '', taskId }, null);
        } else {
          rtype === 'structured'
            ? this._showStructured(d.report, code, subject, taskId)
            : this._showMarkdown(d.report, code, subject, taskId);
        }
      }
    } catch {}
  }

  _showStructured(json, code = '', subject = '', taskId = '') {
    try {
      const rpt = typeof json === 'string' ? JSON.parse(json) : json;
      this._lastRawReport = rpt;
      const sbox  = this._c.querySelector('#report-structured');
      const mbox  = this._c.querySelector('#report-markdown');
      const empty = this._c.querySelector('#report-empty');
      sbox.classList.remove('hidden');
      mbox.classList.add('hidden');
      mbox.dataset.raw = '';
      if (empty) empty.classList.add('hidden');
      this._report.render(rpt);
      // 🤖 Agent 综合研判（选项B）：若有则在结构化报告末尾追加一节
      if (rpt && rpt.agent_review) {
        const card = document.createElement('div');
        card.className = 'mt-4 p-3 rounded-xl border border-blue-200 bg-blue-50/60';
        card.innerHTML =
          `<div class="text-xs font-bold text-blue-700 mb-1.5">🤖 Agent 综合研判</div>` +
          `<div class="text-xs leading-relaxed text-gray-800">${this._md(String(rpt.agent_review))}</div>`;
        sbox.appendChild(card);
      }
      this._setViewMode('structured');
      // 从报告中提取评分和信号
      const score  = rpt?.summary?.score  ?? rpt?.score  ?? null;
      const signal = rpt?.summary?.signal ?? rpt?.signal ?? '';
      this._saveHistory({ code, name: subject, score, signal, taskId }, rpt);
      // 红点 + 切到报告子面板
      this._c.querySelector('#tab-report-badge')?.classList.remove('hidden');
      this._switchSubTab('report');
    } catch { this._showMarkdown(String(json), code, subject, taskId); }
  }

  _showMarkdown(md, code = '', subject = '', taskId = '') {
    const sbox  = this._c.querySelector('#report-structured');
    const mbox  = this._c.querySelector('#report-markdown');
    const empty = this._c.querySelector('#report-empty');
    this._lastRawReport = md;
    sbox.innerHTML = '';
    sbox.classList.add('hidden');
    mbox.dataset.raw = md;
    mbox.innerHTML = this._md(md);
    mbox.classList.remove('hidden');
    if (empty) empty.classList.add('hidden');
    this._setViewMode('markdown');
    this._saveHistory({ code, name: subject, score: null, signal: '', taskId }, md);
    // 红点 + 切到报告子面板
    this._c.querySelector('#tab-report-badge')?.classList.remove('hidden');
    this._switchSubTab('report');
  }

  // ── 日志追加（带 [HH:MM:SS] 时间戳）────────────────────────────────
  _appendLog(line, type = 'default') {
    const box = this._c.querySelector('#log-box');
    if (!line || !box) return;

    const now = new Date();
    const ts  = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(n => String(n).padStart(2, '0')).join(':');

    const row = document.createElement('div');
    row.className = 'flex gap-2 text-xs leading-relaxed font-mono py-0.5';

    const colors = {
      info:    '#6ee7b7',
      error:   '#fca5a5',
      warn:    '#fcd34d',
      default: '#d1fae5',
    };
    let col = colors.default;
    if (/✅|成功|完成/.test(line))      col = colors.info;
    else if (/❌|失败|ERROR/.test(line)) col = colors.error;
    else if (/⚠|WARNING/.test(line))    col = colors.warn;

    const tsEl = document.createElement('span');
    tsEl.className   = 'shrink-0 select-none';
    tsEl.style.color = '#4b5563';
    tsEl.textContent = `[${ts}]`;

    const msgEl = document.createElement('span');
    msgEl.style.color = col;
    msgEl.textContent  = line;

    row.appendChild(tsEl);
    row.appendChild(msgEl);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;

    if (this._activeSub !== 'log') {
      this._c.querySelector('#tab-log-badge')?.classList.remove('hidden');
    }
  }

  // ── 历史记录（localStorage，最多 10 条，显示最近 5 条）──────────────
  // 格式：[{code, name, score, signal, time, taskId}]
  _saveHistory({ code, name, score, signal, taskId } = {}, rpt = null) {
    let list = this._loadHistoryList();
    // 去重（需求1）：同 code 只保留最新——删旧项及其报告缓存
    if (code) {
      list.filter(h => h.code === code).forEach(h => {
        if (h.taskId) { try { localStorage.removeItem(REPORT_CACHE_PREFIX + h.taskId); } catch {} }
      });
      list = list.filter(h => h.code !== code);
    }
    list.unshift({
      code:   code   || '',
      name:   name   || code || '',
      score:  score  ?? null,
      signal: signal || '',
      time:   Date.now(),
      taskId: taskId || '',
    });
    if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
    // 缓存完整报告 JSON（< 200KB 才写入）
    if (rpt != null && taskId) {
      try {
        const reportStr = JSON.stringify(rpt);
        if (reportStr.length < 200 * 1024) {
          try { localStorage.setItem(REPORT_CACHE_PREFIX + taskId, reportStr); } catch(e) {}
        }
      } catch(e) {}
    }
    this._renderHistory();
  }

  _loadHistoryList() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch { return []; }
  }

  _cleanOldReportCache() {
    try {
      const list = this._loadHistoryList();
      const validIds = new Set(list.map(h => h.taskId).filter(Boolean));
      const keysToDelete = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(REPORT_CACHE_PREFIX)) {
          const taskId = key.slice(REPORT_CACHE_PREFIX.length);
          if (!validIds.has(taskId)) keysToDelete.push(key);
        }
      }
      keysToDelete.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }

  _renderHistory() {
    const sec  = this._c.querySelector('#run-history');
    const list = this._c.querySelector('#run-history-list');
    if (!sec || !list) return;
    const items = this._loadHistoryList().slice(0, HISTORY_SHOW);
    if (!items.length) { sec.classList.add('hidden'); return; }
    sec.classList.remove('hidden');

    // 清理孤立缓存（历史列表中已不存在的 taskId）
    this._cleanOldReportCache();

    list.innerHTML = items.map((h, i) => {
      const d    = new Date(h.time);
      const time = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const scoreBadge = h.score != null
        ? `<span class="px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded text-xs font-mono">${h.score}</span>`
        : '';
      const signalBadge = h.signal
        ? `<span class="px-1.5 py-0.5 bg-gray-100 text-gray-500 rounded text-xs">${h.signal}</span>`
        : '';
      const label = h.code
        ? `${h.code}${h.name && h.name !== h.code ? ' · ' + h.name : ''}`
        : (h.name || '分析报告');
      const cached = h.taskId && localStorage.getItem(REPORT_CACHE_PREFIX + h.taskId) != null;
      const cacheIcon = cached
        ? `<span title="已缓存，可离线查看" class="shrink-0 text-xs">💾</span>`
        : `<span title="需联网拉取" class="shrink-0 text-xs">🌐</span>`;
      return `
        <div class="flex items-center gap-2 px-3 py-2 bg-gray-50 rounded-xl text-xs text-gray-600
                    hover:bg-gray-100 cursor-pointer transition-colors"
             data-history-idx="${i}">
          ${cacheIcon}
          ${scoreBadge}
          ${signalBadge}
          <span class="flex-1 font-medium truncate">${label}</span>
          <span class="text-gray-400 shrink-0">${time}</span>
        </div>`;
    }).join('');

    // 点击历史条目：优先读缓存，否则走网络
    list.querySelectorAll('[data-history-idx]').forEach(row => {
      row.addEventListener('click', async () => {
        const idx  = parseInt(row.dataset.historyIdx, 10);
        const item = this._loadHistoryList()[idx];
        if (!item) return;
        // 优先：在线时让 server 打开该 code 最新 HTML 报告（需求2）
        if (item.code) {
          try {
            const r = await fetch(`${SERVER}/open_report?code=${encodeURIComponent(item.code)}`,
                                  { signal: AbortSignal.timeout(3000) });
            const d = await r.json();
            if (d.ok) { this._t.show('已在浏览器打开报告', 'success'); return; }
          } catch {}
        }
        // 回退：缓存结构化视图（离线兜底）
        if (!item.taskId) { this._t.show('无缓存报告，请重新分析', 'warning'); return; }
        const cached = localStorage.getItem(REPORT_CACHE_PREFIX + item.taskId);
        if (cached) {
          try {
            const rpt = JSON.parse(cached);
            if (typeof rpt === 'object' && rpt !== null) {
              this._lastRtype = 'structured';
              this._showStructuredFromCache(rpt, item.code, item.name);
            } else {
              this._lastRtype = 'markdown';
              this._showMarkdownFromCache(String(rpt), item.code, item.name);
            }
            return;
          } catch(e) {}
        }
        this._loadReport(item.taskId, 'structured', item.code, item.name);
      });
    });
  }

  // 从缓存渲染结构化报告（不重新写历史、不重新缓存）
  _showStructuredFromCache(rpt, code = '', subject = '') {
    try {
      this._lastRawReport = rpt;
      const sbox  = this._c.querySelector('#report-structured');
      const mbox  = this._c.querySelector('#report-markdown');
      const empty = this._c.querySelector('#report-empty');
      sbox.classList.remove('hidden');
      mbox.classList.add('hidden');
      mbox.dataset.raw = '';
      if (empty) empty.classList.add('hidden');
      this._report.render(rpt);
      this._setViewMode('structured');
      this._t.show('(已缓存)', 'success');
      this._c.querySelector('#tab-report-badge')?.classList.remove('hidden');
      this._switchSubTab('report');
    } catch(e) { this._t.show('缓存解析失败', 'warning'); }
  }

  // 从缓存渲染 markdown 报告
  _showMarkdownFromCache(md, code = '', subject = '') {
    const sbox  = this._c.querySelector('#report-structured');
    const mbox  = this._c.querySelector('#report-markdown');
    const empty = this._c.querySelector('#report-empty');
    this._lastRawReport = md;
    sbox.innerHTML = '';
    sbox.classList.add('hidden');
    mbox.dataset.raw = md;
    mbox.innerHTML = this._md(md);
    mbox.classList.remove('hidden');
    if (empty) empty.classList.add('hidden');
    this._setViewMode('markdown');
    this._t.show('(已缓存)', 'success');
    this._c.querySelector('#tab-report-badge')?.classList.remove('hidden');
    this._switchSubTab('report');
  }

  // ── 按钮状态 ──────────────────────────────────────────────────────────
  _disableBtns() {
    ['#btn-deep','#btn-market','#btn-full','#btn-batch'].forEach(s => {
      const el = this._c.querySelector(s);
      if (el) el.disabled = true;
    });
  }
  _resetBtns() {
    ['#btn-deep','#btn-market','#btn-full','#btn-batch'].forEach(s => {
      const el = this._c.querySelector(s);
      if (el) el.disabled = false;
    });
  }

  // ── 简易 Markdown -> HTML ────────────────────────────────────────────
  _md(md) {
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return md.split('\n').map(l => {
      if (/^### (.+)/.test(l)) return `<h3 class="font-bold mt-3 mb-1 text-sm">${esc(l.slice(4))}</h3>`;
      if (/^## (.+)/.test(l))  return `<h2 class="font-bold mt-4 mb-2 text-base border-b pb-1">${esc(l.slice(3))}</h2>`;
      if (/^# (.+)/.test(l))   return `<h1 class="font-bold mt-5 mb-2 text-lg">${esc(l.slice(2))}</h1>`;
      if (/^---+$/.test(l))    return '<hr class="my-3 border-gray-200"/>';
      if (/^[-*] (.+)/.test(l)) return `<p class="ml-4">• ${esc(l.slice(2))}</p>`;
      if (!l.trim()) return '<br/>';
      let h = esc(l);
      h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      h = h.replace(/`(.+?)`/g,'<code class="bg-gray-100 px-1 rounded text-blue-700 text-xs">$1</code>');
      return `<p>${h}</p>`;
    }).join('\n');
  }
}

// ── js/tabs/chat.js ──────────────────────────────
/**
 * tabs/chat.js — 🤖 AI 对话（交互式 multi-agent 问答，选项A）
 *
 * 通过 POST /chat 触发 server 端的 AgentOrchestrator（Technical→Intel→Decision 多轮），
 * 复用现有 SSE 通道 /run/stream/<task_id> 显示各 agent 阶段进度，done 后取 /run/report/<id>
 * 作为 assistant 气泡渲染。
 *
 * session_id：前端生成并持久化到 localStorage（key: dsa_chat_session），保证多轮连续。
 * 纯静态模式（server 离线）时优雅提示"需启动本地服务"。
 */

const SESSION_KEY = 'dsa_chat_session';

class ChatTab {
  constructor(container, store, toast) {
    this._c = container;
    this._s = store;
    this._t = toast;
    this._online = false;
    this._busy = false;
    this._sse = null;
  }

  init() {
    this._c.innerHTML = `
      <div class="flex flex-col h-full">
        <!-- 股票上下文（可选）-->
        <div class="flex gap-2 mb-2">
          <input id="chat-code" placeholder="股票代码(可选)"
            class="w-28 px-2 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-blue-400"/>
          <input id="chat-name" placeholder="名称(可选)"
            class="flex-1 px-2 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-blue-400"/>
          <button id="chat-clear"
            class="px-3 py-1.5 text-xs rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600">清空</button>
        </div>

        <!-- 消息流 -->
        <div id="chat-stream"
          class="flex-1 overflow-y-auto space-y-3 p-2 bg-gray-50 rounded-xl min-h-[280px] max-h-[52vh]">
          <div class="text-center text-xs text-gray-400 py-8">
            🤖 向 AI 投研助手提问，例如：<br/>
            "帮我看看这只票现在能不能买"、"结合技术面和风险分析一下"
          </div>
        </div>

        <!-- 输入区 -->
        <div id="chat-hint" class="text-[11px] text-amber-600 mt-2 mb-1 hidden">
          ⚠️ AI 对话需启动本地服务（python portal/server.py）
        </div>
        <div class="flex gap-2 mt-2">
          <textarea id="chat-input" rows="2" placeholder="输入问题，Enter 发送 / Shift+Enter 换行"
            class="flex-1 px-3 py-2 text-xs border border-gray-200 rounded-xl resize-none focus:outline-none focus:border-blue-400"></textarea>
          <button id="chat-send"
            class="px-4 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white
                   shadow-sm shadow-blue-200 active:scale-[.99] disabled:opacity-50 disabled:cursor-not-allowed">
            发送
          </button>
        </div>
      </div>
    `;

    this._stream = this._c.querySelector('#chat-stream');
    this._input  = this._c.querySelector('#chat-input');
    this._sendBtn = this._c.querySelector('#chat-send');

    this._sendBtn.addEventListener('click', () => this._send());
    this._input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this._send(); }
    });
    this._c.querySelector('#chat-clear').addEventListener('click', () => this._clear());

    this._syncOnlineUI();
  }

  // 由 app.js 的 _switchTab 调用（若注册），保持与 RunTab 一致
  setServerStatus(online) {
    this._online = online;
    this._syncOnlineUI();
  }

  _syncOnlineUI() {
    const hint = this._c.querySelector('#chat-hint');
    if (hint) hint.classList.toggle('hidden', this._online);
  }

  _sessionId() {
    let sid = null;
    try { sid = localStorage.getItem(SESSION_KEY); } catch {}
    if (!sid) {
      sid = (crypto?.randomUUID?.() ? `sess_${crypto.randomUUID()}` : `sess_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
      try { localStorage.setItem(SESSION_KEY, sid); } catch {}
    }
    return sid;
  }

  _clear() {
    try { localStorage.removeItem(SESSION_KEY); } catch {}
    this._stream.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">🆕 已开始新对话</div>`;
    this._t?.show?.('已开始新对话', 'info');
  }

  _bubble(role, html) {
    const wrap = document.createElement('div');
    const isUser = role === 'user';
    wrap.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
    wrap.innerHTML = `
      <div class="${isUser ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-200'}
                  max-w-[85%] px-3 py-2 rounded-2xl text-xs leading-relaxed shadow-sm
                  ${isUser ? 'rounded-br-sm' : 'rounded-bl-sm'}">${html}</div>`;
    // 首次发消息时清掉占位提示
    const placeholder = this._stream.querySelector('.text-center');
    if (placeholder) placeholder.remove();
    this._stream.appendChild(wrap);
    this._stream.scrollTop = this._stream.scrollHeight;
    return wrap.firstElementChild;
  }

  async _send() {
    if (this._busy) return;
    const message = this._input.value.trim();
    if (!message) return;
    if (!this._online) {
      this._t?.show?.('AI 对话需启动本地服务', 'error');
      return;
    }

    this._busy = true;
    this._sendBtn.disabled = true;
    this._bubble('user', this._esc(message));
    this._input.value = '';

    const code = this._c.querySelector('#chat-code').value.trim().toUpperCase();
    const name = this._c.querySelector('#chat-name').value.trim();

    // 助手"思考中"气泡（先展示 stage 进度，done 后替换成最终回答）
    const thinking = this._bubble('assistant', '<span class="text-gray-400">🤖 思考中…</span>');
    const stages = [];

    let taskId, sessionId;
    try {
      const res = await fetch(`${SERVER}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: this._sessionId(), stock_code: code, stock_name: name || code }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || '请求失败');
      taskId = d.task_id;
      sessionId = d.session_id;
      if (sessionId) { try { localStorage.setItem(SESSION_KEY, sessionId); } catch {} }
    } catch (e) {
      thinking.innerHTML = `<span class="text-red-500">❌ ${this._esc(e.message)}</span>`;
      this._finish();
      return;
    }

    // 复用现有 SSE 通道
    const sse = new EventSource(`${SERVER}/run/stream/${taskId}`);
    this._sse = sse;

    sse.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        if (d.log) {
          stages.push(d.log);
          // 只展示最近几条 stage 进度
          const recent = stages.slice(-4).map(s => this._esc(s)).join('<br/>');
          thinking.innerHTML = `<span class="text-gray-400">🤖 ${recent}</span>`;
          this._stream.scrollTop = this._stream.scrollHeight;
        }
      } catch {}
    };

    sse.addEventListener('done', async () => {
      sse.close(); this._sse = null;
      try {
        const res = await fetch(`${SERVER}/run/report/${taskId}`);
        const d = await res.json();
        const answer = (d.report || '').trim();
        thinking.innerHTML = answer ? this._md(answer) : '<span class="text-gray-400">（无回复）</span>';
      } catch (e) {
        thinking.innerHTML = `<span class="text-red-500">❌ 获取回复失败：${this._esc(e.message)}</span>`;
      }
      this._stream.scrollTop = this._stream.scrollHeight;
      this._finish();
    });

    sse.onerror = () => {
      sse.close(); this._sse = null;
      // 连接断开后兜底拉一次结果
      setTimeout(async () => {
        try {
          const res = await fetch(`${SERVER}/run/report/${taskId}`);
          const d = await res.json();
          const answer = (d.report || '').trim();
          if (answer) thinking.innerHTML = this._md(answer);
        } catch {}
        this._finish();
      }, 600);
    };
  }

  _finish() {
    this._busy = false;
    this._sendBtn.disabled = false;
    this._input.focus();
  }

  _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 轻量 markdown 渲染（与 run.js 的 _md 同款风格）
  _md(md) {
    const esc = this._esc;
    return md.split('\n').map(l => {
      if (/^### (.+)/.test(l)) return `<h3 class="font-bold mt-2 mb-1 text-xs">${esc(l.slice(4))}</h3>`;
      if (/^## (.+)/.test(l))  return `<h2 class="font-bold mt-2 mb-1 text-sm">${esc(l.slice(3))}</h2>`;
      if (/^# (.+)/.test(l))   return `<h1 class="font-bold mt-2 mb-1 text-sm">${esc(l.slice(2))}</h1>`;
      if (/^---+$/.test(l))    return '<hr class="my-2 border-gray-200"/>';
      if (/^[-*] (.+)/.test(l)) return `<p class="ml-3">• ${esc(l.slice(2))}</p>`;
      if (!l.trim()) return '<br/>';
      let h = esc(l);
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/`(.+?)`/g, '<code class="bg-gray-100 px-1 rounded text-blue-700">$1</code>');
      return `<p>${h}</p>`;
    }).join('\n');
  }
}

/**

// ── ResearchTab：基本面 + 产业链独立分析 ──────────────────────────────────
/**
 * ResearchTab — 基本面 + 产业链研究，可独立运行，与技术面完全分离。
 * 复用 RunTab 的核心 SSE/Report/Log 逻辑，只预设 fundamental+industry 维度。
 */
const RESEARCH_DIM_DEFS = {
  fundamental: DIM_DEFS.fundamental,
  industry:    DIM_DEFS.industry,
};
const RESEARCH_HISTORY_KEY = 'dsa_research_history';

class ResearchTab {
  constructor(container, store, toast) {
    this._c = container; this._s = store; this._t = toast;
    this._online         = false;
    this._sse            = null;
    this._report         = null;
    this._selDims        = new Set(['fundamental', 'industry']);
    this._selMods        = Object.fromEntries(
      Object.entries(RESEARCH_DIM_DEFS).map(([k, v]) => [k, new Set(Object.keys(v.mods))])
    );
    this._serverStarting = false;
    this._activeSub      = 'analyze';
    this._viewMode       = 'structured';
    this._lastRawReport  = null;
    this._lastRtype      = null;
  }

  init() {
    this._render();
    this._s.subscribe(st => this._syncChips(st));
  }

  setServerStatus(online) {
    const changed = online !== this._online;
    this._online = online;
    if (changed) this._updateOnlineUI();
  }

  _render() {
    this._c.innerHTML = `
      <div class="pb-20">

        <!-- 子 Tab 导航栏 -->

              </label>

                <button id="res-btn-deep"

                         text-white text-xs font-bold rounded-xl transition-colors shadow-sm shadow-emerald-200
                         active:scale-[.99] disabled:opacity-50 disabled:cursor-not-allowed">
                  🔍 立即分析
                </button>
                <button id="res-btn-batch"
                  class="py-2.5 bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200
                         text-xs font-semibold rounded-xl transition-colors
                         active:scale-[.99] disabled:opacity-50 disabled:cursor-not-allowed">

            </div>

                 style="font-family:'Menlo','Monaco','Consolas',monospace;font-size:.7rem;line-height:1.6"></div>

        <!-- ══ 子面板 3：报告 ══ -->

          <!-- 工具栏 -->
          <div class="flex items-center gap-2">
            <button id="res-btn-copy-report"
              class="px-3 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">
              📋 复制
            </button>

                class="px-3 py-1.5 text-xs font-medium transition-colors bg-blue-600 text-white">
                结构化

                class="px-3 py-1.5 text-xs font-medium transition-colors bg-white text-gray-500 hover:bg-gray-50">
                Markdown
              </button>

          <div id="res-report-area" class="min-h-[20rem]">
            <div id="res-report-empty" class="flex flex-col items-center justify-center py-16 text-gray-300">
              <span class="text-4xl mb-3">📋</span>
              <p class="text-sm">暂无报告，请先运行分析</p>
            </div>
            <div id="res-report-structured" class="hidden"></div>
            <div id="res-report-markdown"
              class="hidden prose prose-sm max-w-none p-4 rounded-2xl border border-gray-100 bg-white
                     leading-relaxed text-gray-700 overflow-x-auto"
              style="font-size:.82rem"></div>
          </div>

          <!-- 历史列表 -->
          <div id="res-history-list" class="space-y-2"></div>
        </div>

      </div>`;

    this._report = new ReportView(this._c.querySelector('#res-report-structured'));
    this._bindEvents();
    this._buildDims();
    this._renderHistory();
  }

  _buildDims() {
    const list = this._c.querySelector('#res-dim-list');
    Object.entries(RESEARCH_DIM_DEFS).forEach(([dimKey, dimDef]) => {
      const c = dimDef.color || 'emerald';
      const wrap = document.createElement('div');
      wrap.className = 'border-0 overflow-hidden';
      const checked = this._selDims.has(dimKey);
      wrap.innerHTML = `
        <div class="flex items-center gap-3 px-3 py-2 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors"
             data-dim="${dimKey}">
          <input type="checkbox" id="res-dim-${dimKey}" ${checked ? 'checked' : ''}
            class="w-4 h-4 accent-${c}-600 cursor-pointer" />
          <label for="res-dim-${dimKey}" class="text-xs font-medium text-gray-700 cursor-pointer flex-1 select-none">
            ${dimDef.label}
          </label>
          <span class="text-xs text-gray-400">▼</span>
        </div>
        <div class="res-dim-mods ${checked ? '' : 'hidden'} px-3 py-2 grid grid-cols-2 sm:grid-cols-3 gap-1.5 bg-white"
             data-dim="${dimKey}">
          ${Object.entries(dimDef.mods).map(([mk, ml]) => `
            <label class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer hover:text-${c}-600">
              <input type="checkbox" class="res-mod-cb accent-${c}-600 w-3.5 h-3.5"
                data-dim="${dimKey}" data-mod="${mk}"
                ${this._selMods[dimKey]?.has(mk) ? 'checked' : ''} />
              ${ml}
            </label>`).join('')}
        </div>`;
      list.appendChild(wrap);
    });

    list.querySelectorAll('[data-dim]').forEach(row => {
      if (row.classList.contains('res-dim-mods')) return;
      row.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') return;
        const cb = row.querySelector('input[type=checkbox]');
        cb.checked = !cb.checked; cb.dispatchEvent(new Event('change'));
      });
    });
    list.querySelectorAll('[id^="res-dim-"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const k = cb.id.replace('res-dim-', '');
        const modsEl = list.querySelector(`.res-dim-mods[data-dim="${k}"]`);
        cb.checked ? this._selDims.add(k) : this._selDims.delete(k);
        modsEl?.classList.toggle('hidden', !cb.checked);
        this._updateDimsCount();
      });
    });
    list.querySelectorAll('.res-mod-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const { dim, mod } = cb.dataset;
        cb.checked ? this._selMods[dim]?.add(mod) : this._selMods[dim]?.delete(mod);
      });
    });
  }

  _updateDimsCount() {
    const el = this._c.querySelector('#res-dims-count');
    if (el) el.textContent = this._selDims.size;
  }

  _syncChips(state) {
    const chips = this._c.querySelector('#res-chips');
    if (!chips) return;
    const stocks = state.stock_list || [];
    if (!stocks.length) {
      chips.innerHTML = '<span class="text-xs text-gray-300">（自选股为空，先去「自选股」Tab 添加）</span>';
      return;
    }
    chips.innerHTML = stocks.map(s => {
      const label = s.name ? `${this._esc(s.name)}` : s.code;
      return `<button class="chip px-2.5 py-1 text-xs border border-gray-200 rounded-lg text-gray-600"
              data-code="${s.code}" data-name="${this._esc(s.name || '')}">${label}</button>`;
    }).join('');
    chips.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        this._c.querySelector('#res-code').value = btn.dataset.code;
        const nameEl = this._c.querySelector('#res-name');
        if (nameEl) nameEl.value = btn.dataset.name || '';
        chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('selected', b === btn));
      });
    });
  }

  _updateOnlineUI() {
    const dot   = this._c.querySelector('#res-dot');
    const label = this._c.querySelector('#res-svc-label');
    const chip  = this._c.querySelector('#res-svc-chip');
    if (!dot) return;
    if (this._online) {
      dot.className     = 'status-dot online';
      label.textContent = '本地服务在线';
      chip.className    = chip.className.replace(/bg-\S+|border-\S+|text-\S+/g, '').trim()
        + ' bg-green-50 border-green-200 text-green-700';
    } else {
      dot.className     = 'status-dot offline';
      label.textContent = '纯静态模式';
      chip.className    = chip.className.replace(/bg-\S+|border-\S+|text-\S+/g, '').trim()
        + ' bg-gray-50 border-gray-200 text-gray-400';
    }
  }

  _switchSubTab(name) {
    ['analyze','log','report'].forEach(p => {
      const el  = this._c.querySelector(`#res-sub-${p}`);
      const btn = this._c.querySelector(`.res-sub-tab[data-sub="${p}"]`);
      if (!el || !btn) return;
      const active = p === name;
      el.classList.toggle('hidden', !active);
      if (active) {
        btn.classList.remove('text-gray-500');
        btn.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      } else {
        btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
        btn.classList.add('text-gray-500');
      }
    });
    this._activeSub = name;
    if (name === 'log')    this._c.querySelector('#res-log-badge')?.classList.add('hidden');
    if (name === 'report') this._c.querySelector('#res-report-badge')?.classList.add('hidden');
  }

  _bindEvents() {
    this._c.querySelectorAll('.res-sub-tab').forEach(btn => {
      btn.addEventListener('click', () => this._switchSubTab(btn.dataset.sub));
    });
    this._c.querySelector('#res-btn-deep').addEventListener('click', () => this._deepAnalyze());
    this._c.querySelector('#res-btn-batch').addEventListener('click', () => this._batchAnalyze());
    this._c.querySelector('#res-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') this._deepAnalyze();
    });
    this._c.querySelector('#res-btn-clear-log').addEventListener('click', () => {
      this._c.querySelector('#res-log-box').innerHTML = '';
    });
    this._c.querySelector('#res-btn-copy-report').addEventListener('click', async () => {
      const mbox = this._c.querySelector('#res-report-markdown');
      const sbox = this._c.querySelector('#res-report-structured');
      try {
        await navigator.clipboard.writeText(mbox.dataset.raw || sbox.innerText || '');
        this._t.show('已复制', 'success');
      } catch { this._t.show('复制失败', 'warning'); }
    });
    this._c.querySelector('#res-btn-view-structured').addEventListener('click', () => this._setViewMode('structured'));
    this._c.querySelector('#res-btn-view-markdown').addEventListener('click', () => this._setViewMode('markdown'));
    // 初始激活第一个子tab
    this._switchSubTab('analyze');
  }

  _setViewMode(mode) {
    this._viewMode = mode;
    const btnS = this._c.querySelector('#res-btn-view-structured');
    const btnM = this._c.querySelector('#res-btn-view-markdown');
    const sbox = this._c.querySelector('#res-report-structured');
    const mbox = this._c.querySelector('#res-report-markdown');
    if (mode === 'structured') {
      btnS.className = 'px-3 py-1.5 text-xs font-medium transition-colors bg-blue-600 text-white';
      btnM.className = 'px-3 py-1.5 text-xs font-medium transition-colors bg-white text-gray-500 hover:bg-gray-50';
      sbox.classList.remove('hidden');
      mbox.classList.add('hidden');
    } else {
      btnM.className = 'px-3 py-1.5 text-xs font-medium transition-colors bg-blue-600 text-white';
      btnS.className = 'px-3 py-1.5 text-xs font-medium transition-colors bg-white text-gray-500 hover:bg-gray-50';
      mbox.classList.remove('hidden');
      sbox.classList.add('hidden');
      if (!mbox.dataset.raw && this._lastRawReport && this._lastRtype === 'structured') {
        mbox.dataset.raw = typeof this._lastRawReport === 'string'
          ? this._lastRawReport
          : JSON.stringify(this._lastRawReport, null, 2);
        mbox.innerHTML = this._md(mbox.dataset.raw);
      }
    }
  }

  async _ensureServer() {
    if (this._online) return true;
    if (this._serverStarting) {
      this._t.show('正在等待本地服务启动...', 'warning');
      return false;
    }
    this._serverStarting = true;
    this._t.show('需要本地服务，请运行：python portal/server.py', 'warning', 8000);
    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1000));
      try {
        const r = await fetch(`${SERVER}/health`, { signal: AbortSignal.timeout(1000) });
        if (r.ok) {
          this._online = true;
          this._serverStarting = false;
          this._updateOnlineUI();
          window.dispatchEvent(new CustomEvent('server-online'));
          return true;
        }
      } catch {}
    }
    this._serverStarting = false;
    this._t.show('本地服务未启动，请先运行 server.py', 'error');
    return false;
  }

  async _deepAnalyze() {
    const code = this._c.querySelector('#res-code').value.trim().toUpperCase();
    const name = this._c.querySelector('#res-name').value.trim();
    if (!code) { this._t.show('请输入股票代码', 'warning'); return; }
    const dims = [...this._selDims];
    if (!dims.length) { this._t.show('请至少选择一个研究维度', 'warning'); return; }
    const ok = await this._ensureServer();
    if (!ok) return;
    await this._runSingle(code, name || code, dims);
  }

  async _batchAnalyze() {
    const dims = [...this._selDims];
    if (!dims.length) { this._t.show('请至少选择一个研究维度', 'warning'); return; }
    const state = this._s.get();
    const checked = (state.stock_list || []).filter(s => s.checked);
    if (!checked.length) {
      this._t.show('请先在「自选股」Tab 勾选要分析的股票', 'warning');
      return;
    }
    const ok = await this._ensureServer();
    if (!ok) return;

    this._prepareLog(`📑 批量研究 ${checked.length} 只自选股`);
    this._disableBtns();
    let done = 0, failed = 0;
    for (const s of checked) {
      done++;
      this._disableBtns();
      this._appendLog(`──────── (${done}/${checked.length}) ${s.name || s.code} ────────`, 'info');
      try {
        const okOne = await this._runSingle(s.code, s.name || s.code, dims, { batch: true });
        if (!okOne) failed++;
      } catch (e) {
        failed++;
        this._appendLog(`❌ ${s.code} 分析异常：${e.message}`, 'error');
      }
    }
    const badge = this._c.querySelector('#res-badge');
    badge.textContent = `批量完成 ${done - failed}/${done}`;
    badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${failed ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`;
    this._resetBtns();
    this._t.show(`批量研究完成：成功 ${done - failed} / 共 ${done}`, failed ? 'warning' : 'success', 6000);
    this._switchSubTab('report');
  }

  async _runSingle(code, name, dims, { batch = false } = {}) {
    const modulesMap = Object.fromEntries(dims.map(d => [d, [...(this._selMods[d] || [])]]));
    if (!batch) {
      this._prepareLog(`🔬 研究分析：${name || code}（${code}）`);
    } else {
      this._appendLog(`🔬 研究分析：${name || code}（${code}）`, 'info');
    }
    let taskId;
    try {
      const res = await fetch(`${SERVER}/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          stock_code: code,
          stock_name: name || code,
          dimensions: dims,
          modules: modulesMap,
          llm_mode: this._s.get().llm_note_mode || 'batch',
          open_report: this._s.get().auto_open_html !== false,
          agent_review: !!this._c.querySelector('#res-agent-review')?.checked,
        }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      taskId = d.task_id;
    } catch (e) {
      this._appendLog(`❌ 启动失败：${e.message}`, 'error');
      if (!batch) { this._t.show(`启动失败: ${e.message}`, 'error'); this._resetBtns(); }
      return false;
    }
    return this._listenSSE(taskId, 'structured', code, name || code);
  }

  _prepareLog(title) {
    if (this._sse) { this._sse.close(); this._sse = null; }
    this._c.querySelector('#res-log-box').innerHTML = '';
    this._c.querySelector('#res-report-structured').innerHTML = '';
    const badge = this._c.querySelector('#res-badge');
    badge.textContent = '运行中';
    badge.className = 'text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium';
    this._appendLog(title, 'info');
    this._disableBtns();
    this._switchSubTab('log');
  }

  _listenSSE(taskId, rtype, code = '', subject = '') {
    return new Promise((resolve) => {
      const sse = new EventSource(`${SERVER}/run/stream/${taskId}`);
      this._sse = sse;
      let settled = false;
      const finish = (ok) => { if (!settled) { settled = true; resolve(ok); } };

      sse.onmessage = e => {
        const d = JSON.parse(e.data);
        this._appendLog(d.log, d.status === 'error' ? 'error' : 'default');
      };
      sse.addEventListener('done', e => {
        sse.close(); this._sse = null;
        const d = JSON.parse(e.data);
        const ok = d.status === 'done';
        const badge = this._c.querySelector('#res-badge');
        badge.textContent = ok ? '完成 ✓' : '失败 ✗';
        badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
        this._resetBtns();
        if (d.has_report) {
          this._loadReport(taskId, d.report_type || rtype, code, subject).finally(() => finish(ok));
        } else {
          finish(ok);
        }
      });
      sse.onerror = () => {
        sse.close(); this._sse = null;
        this._appendLog('⚠️ 连接断开，拉取结果...', 'warn');
        setTimeout(() => {
          this._loadReport(taskId, rtype, code, subject).finally(() => finish(false));
        }, 600);
        this._resetBtns();
      };
    });
  }

  async _loadReport(taskId, rtype, code = '', subject = '') {
    try {
      const res = await fetch(`${SERVER}/run/report/${taskId}`);
      const d = await res.json();
      const box = this._c.querySelector('#res-log-box');
      if (d.logs) {
        const ex = box.children.length;
        d.logs.slice(ex).forEach(l => this._appendLog(l));
      }
      if (d.report) {
        this._lastRtype = rtype;
        rtype === 'structured'
          ? this._showStructured(d.report, code, subject, taskId)
          : this._showMarkdown(d.report, code, subject, taskId);
      }
    } catch {}
  }

  _showStructured(json, code = '', subject = '', taskId = '') {
    try {
      const rpt = typeof json === 'string' ? JSON.parse(json) : json;
      this._lastRawReport = rpt;
      const sbox  = this._c.querySelector('#res-report-structured');
      const mbox  = this._c.querySelector('#res-report-markdown');
      const empty = this._c.querySelector('#res-report-empty');
      sbox.classList.remove('hidden');
      mbox.classList.add('hidden');
      mbox.dataset.raw = '';
      if (empty) empty.classList.add('hidden');
      this._report.render(rpt);
      if (rpt && rpt.agent_review) {
        const card = document.createElement('div');
        card.className = 'mt-4 p-3 rounded-xl border border-emerald-200 bg-emerald-50/60';
        card.innerHTML =
          `<div class="text-xs font-bold text-emerald-700 mb-1.5">🤖 Agent 综合研判</div>` +
          `<div class="text-xs leading-relaxed text-gray-800">${this._md(String(rpt.agent_review))}</div>`;
        sbox.appendChild(card);
      }
      this._setViewMode('structured');
      const score  = rpt?.summary?.score  ?? rpt?.score  ?? null;
      const signal = rpt?.summary?.signal ?? rpt?.signal ?? '';
      this._saveHistory({ code, name: subject, score, signal, taskId }, rpt);
      this._c.querySelector('#res-report-badge')?.classList.remove('hidden');
      this._switchSubTab('report');
    } catch { this._showMarkdown(String(json), code, subject, taskId); }
  }

  _showMarkdown(md, code = '', subject = '', taskId = '') {
    const sbox  = this._c.querySelector('#res-report-structured');
    const mbox  = this._c.querySelector('#res-report-markdown');
    const empty = this._c.querySelector('#res-report-empty');
    this._lastRawReport = md;
    sbox.innerHTML = '';
    sbox.classList.add('hidden');
    mbox.dataset.raw = md;
    mbox.innerHTML = this._md(md);
    mbox.classList.remove('hidden');
    if (empty) empty.classList.add('hidden');
    this._setViewMode('markdown');
    this._saveHistory({ code, name: subject, score: null, signal: '', taskId }, md);
    this._c.querySelector('#res-report-badge')?.classList.remove('hidden');
    this._switchSubTab('report');
  }

  _appendLog(line, type = 'default') {
    const box = this._c.querySelector('#res-log-box');
    if (!line || !box) return;
    const now = new Date();
    const ts  = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(n => String(n).padStart(2, '0')).join(':');
    const row = document.createElement('div');
    row.className = 'flex gap-2 text-xs leading-relaxed font-mono py-0.5';
    const colors = { info:'#6ee7b7', error:'#fca5a5', warn:'#fcd34d', default:'#d1fae5' };
    let col = colors.default;
    if (/✅|成功|完成/.test(line)) col = colors.info;
    else if (/❌|失败|ERROR/.test(line)) col = colors.error;
    else if (/⚠|WARNING/.test(line)) col = colors.warn;
    const tsEl = document.createElement('span');
    tsEl.className = 'shrink-0 select-none'; tsEl.style.color = '#4b5563'; tsEl.textContent = `[${ts}]`;
    const msgEl = document.createElement('span');
    msgEl.style.color = col; msgEl.textContent = line;
    row.appendChild(tsEl); row.appendChild(msgEl);
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
    if (this._activeSub !== 'log') this._c.querySelector('#res-log-badge')?.classList.remove('hidden');
  }

  _disableBtns() {
    ['res-btn-deep','res-btn-batch'].forEach(id => {
      const b = this._c.querySelector(`#${id}`);
      if (b) { b.disabled = true; b.classList.add('opacity-50','cursor-not-allowed'); }
    });
  }

  _resetBtns() {
    ['res-btn-deep','res-btn-batch'].forEach(id => {
      const b = this._c.querySelector(`#${id}`);
      if (b) { b.disabled = false; b.classList.remove('opacity-50','cursor-not-allowed'); }
    });
  }

  _saveHistory({ code, name, score, signal, taskId } = {}, rpt = null) {
    let list = this._loadHistoryList();
    if (code) {
      list.filter(h => h.code === code).forEach(h => {
        if (h.taskId) { try { localStorage.removeItem(REPORT_CACHE_PREFIX + h.taskId); } catch {} }
      });
      list = list.filter(h => h.code !== code);
    }
    list.unshift({ code: code||'', name: name||code||'', score: score??null, signal: signal||'', time: Date.now(), taskId: taskId||'' });
    if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
    try { localStorage.setItem(RESEARCH_HISTORY_KEY, JSON.stringify(list)); } catch {}
    if (rpt != null && taskId) {
      try {
        const reportStr = JSON.stringify(rpt);
        if (reportStr.length < 200 * 1024) {
          localStorage.setItem(REPORT_CACHE_PREFIX + 'r_' + taskId, reportStr);
        }
      } catch {}
    }
    this._renderHistory();
  }

  _loadHistoryList() {
    try { return JSON.parse(localStorage.getItem(RESEARCH_HISTORY_KEY) || '[]'); } catch { return []; }
  }

  _renderHistory() {
    const list = this._loadHistoryList();
    const el = this._c.querySelector('#res-history-list');
    if (!el) return;
    if (!list.length) { el.innerHTML = ''; return; }
    const sig2cls = { buy:'bg-green-100 text-green-700', watch:'bg-blue-100 text-blue-700', hold:'bg-gray-100 text-gray-500', sell:'bg-red-100 text-red-700' };
    el.innerHTML = `
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">近期记录</p>
      ${list.slice(0, HISTORY_SHOW).map(h => {
        const sc = h.score != null ? `<span class="text-xs text-gray-400">${h.score}分</span>` : '';
        const sg = h.signal ? `<span class="text-xs px-1.5 py-0.5 rounded ${sig2cls[h.signal]||sig2cls.hold} font-medium">${(SIGNAL_CONFIG[h.signal]||SIGNAL_CONFIG.hold).label}</span>` : '';
        const t  = h.time ? new Date(h.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
        const cacheKey = REPORT_CACHE_PREFIX + 'r_' + h.taskId;
        return `
          <div class="flex items-center gap-2 px-3 py-2 bg-white border border-gray-100 rounded-xl hover:bg-gray-50 cursor-pointer transition-colors"
               data-taskid="${h.taskId}" data-code="${h.code}" data-name="${this._esc(h.name||'')}">
            <div class="flex-1 min-w-0">
              <span class="text-sm font-medium text-gray-800">${this._esc(h.name||h.code)}</span>
              <span class="ml-1.5 text-xs font-mono text-gray-400">${h.code}</span>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">${sc}${sg}</div>
            <span class="text-xs text-gray-300 flex-shrink-0">${t}</span>
          </div>`;
      }).join('')}`;

    el.querySelectorAll('[data-taskid]').forEach(row => {
      row.addEventListener('click', () => {
        const taskId = row.dataset.taskid;
        const code = row.dataset.code;
        const name = row.dataset.name;
        if (!taskId) return;
        const cached = (() => { try { return localStorage.getItem(REPORT_CACHE_PREFIX + 'r_' + taskId); } catch { return null; } })();
        if (cached) {
          try {
            const rpt = JSON.parse(cached);
            const sbox = this._c.querySelector('#res-report-structured');
            const mbox = this._c.querySelector('#res-report-markdown');
            const empty = this._c.querySelector('#res-report-empty');
            sbox.classList.remove('hidden'); mbox.classList.add('hidden');
            if (empty) empty.classList.add('hidden');
            this._report.render(rpt);
            this._switchSubTab('report');
            return;
          } catch {}
        }
        this._loadReport(taskId, 'structured', code, name);
        this._switchSubTab('report');
      });
    });
  }

  _md(text) {
    return String(text||'')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`([^`]+)`/g,'<code class="bg-gray-100 px-1 rounded text-xs">$1</code>')
      .replace(/^### (.+)$/gm,'<h3 class="text-sm font-semibold mt-3 mb-1.5">$1</h3>')
      .replace(/^## (.+)$/gm,'<h2 class="text-base font-semibold mt-4 mb-2">$1</h2>')
      .replace(/^# (.+)$/gm,'<h1 class="text-lg font-bold mt-4 mb-2">$1</h1>')
      .replace(/^\- (.+)$/gm,'<li class="ml-4 list-disc text-gray-600">$1</li>')
      .replace(/\n/g,'<br/>');
  }

  _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

const TABS = [
  { id: 'run',       icon: '▶',  label: '技术面', Cls: RunTab },
  { id: 'research',  icon: '🔬', label: '基本面', Cls: ResearchTab },
  { id: 'chat',      icon: '🤖', label: 'AI 对话',  Cls: ChatTab },
  { id: 'watchlist', icon: '☰',  label: '选股',     Cls: WatchlistTab },
  { id: 'settings',  icon: '⚙', label: '设置',     Cls: SettingsTab },
  { id: 'guide',     icon: '?',  label: '说明',     Cls: GuideTab },
];

class App {
  constructor() {
    this._instances = {};
    this._activeId  = 'run';
    this._online    = false;
  }

  init() {
    this._buildNav();
    this._buildPanels();
    modal.init(store, SERVER, toast);
    this._bindSave();
    this._bindFooter();
    this._pollServer();
    this._restoreTab();
  }

  // ── Nav ─────────────────────────────────────────────────
  _buildNav() {
    const nav = document.getElementById('tab-nav');
    TABS.forEach(({ id, icon, label }) => {
      const btn = document.createElement('button');
      btn.id = `nav-${id}`;
      btn.className = 'nav-tab flex-1 flex items-center justify-center gap-0.5 py-1.5 px-1 text-xs font-medium text-white/70 rounded-lg whitespace-nowrap min-w-0';
      btn.innerHTML = `<span>${icon}</span><span>${label}</span>`;
      btn.addEventListener('click', () => this._switchTab(id));
      nav.appendChild(btn);
    });
  }

  _buildPanels() {
    const content = document.getElementById('tab-content');
    TABS.forEach(({ id, Cls }) => {
      const panel = document.createElement('div');
      panel.id = `panel-${id}`;
      panel.className = 'tab-panel';
      content.appendChild(panel);
      const inst = new Cls(panel, store, toast);
      inst.init();
      this._instances[id] = inst;
    });
  }

  _switchTab(id) {
    this._activeId = id;
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.getElementById(`panel-${id}`)?.classList.add('active');
    document.getElementById(`nav-${id}`)?.classList.add('active');
    try { sessionStorage.setItem('dsa_tab', id); } catch {}
  }

  _restoreTab() {
    const saved = (() => { try { return sessionStorage.getItem('dsa_tab'); } catch {} })();
    this._switchTab(TABS.some(t => t.id === saved) ? saved : 'run');
  }

  // ── Server poll ─────────────────────────────────────────
  async _pollServer() {
    const check = async () => {
      let ok = false;
      try {
        const r = await fetch(`${SERVER}/health`, { signal: AbortSignal.timeout(1500) });
        ok = r.ok;
      } catch {}
      if (ok !== this._online) {
        this._online = ok;
        this._updateStatusUI(ok);
        // 通知 RunTab / ResearchTab / ChatTab
        this._instances['run']?.setServerStatus?.(ok);
        this._instances['research']?.setServerStatus?.(ok);
        this._instances['chat']?.setServerStatus?.(ok);
      }
    };
    await check();
    setInterval(check, 5000);
  }

  _updateStatusUI(online) {
    const dot   = document.getElementById('status-dot');
    const label = document.getElementById('status-label');
    if (!dot || !label) return;
    dot.className   = `status-dot ${online ? 'online' : 'offline'}`;
    label.textContent = online ? '本地服务在线' : '纯静态模式';
    label.className   = `text-xs ${online ? 'text-green-300 font-medium' : 'text-blue-200'}`;
    // 通知 modal
    modal.setServerOnline(online);
  }

  // ── Footer ───────────────────────────────────────────────
  _bindFooter() {
    store.subscribe(() => {
      const el = document.getElementById('footer-time');
      if (!el) return;
      el.textContent = `上次编辑 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
    });
  }

  _bindSave() {
    document.getElementById('btn-save')?.addEventListener('click', () => {
      modal.show(store.toJSON());
    });
  }
}

document.addEventListener('DOMContentLoaded', () => new App().init());
</script>
</body>
